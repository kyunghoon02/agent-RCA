schema_version: "2.0.0"

core_boundary:
  domain_neutral: true
  raw_telemetry_allowed: false
  evidence_reference_required: true
  records:
    - Entity
    - SnapshotInterval
    - RelationInterval
    - EventAggregate

identity:
  contract_version: "1.0.0"
  entity_id: projector-owned-stable-identity
  kubernetes_resource_keys:
    - cluster_id
    - uid
  kubernetes_placeholder_keys:
    - cluster_id
    - api_version
    - kind
    - namespace
    - name
  logical_service_keys:
    - cluster_id
    - namespace
    - service_name
  logical_service_is_distinct_from_kubernetes_service: true
  same_external_identity_reuses_entity: true
  changed_external_identity_is_new_entity: true
  unresolved_to_resolved_transition:
    merge_entities: false
    relation_type: RESOLVES_TO
    preserves_reference_history: true

common_entity_types:
  - Service
  - Process
  - Job
  - Queue
  - Database
  - Cache
  - ExternalDependency
  - Deployment
  - InfrastructureResource

common_relation_types:
  - DEPENDS_ON
  - CALLS
  - ROUTES_TO
  - PROCESSES
  - READS_FROM
  - WRITES_TO
  - RUNS_ON
  - CHANGED_BY
  - REFERENCES
  - REPRESENTED_BY
  - RESOLVES_TO

projectors:
  kubernetes:
    entity_types:
      - Namespace
      - Deployment
      - ReplicaSet
      - Pod
      - Service
      - EndpointSlice
      - ConfigMap
      - ResourceQuota
      - PersistentVolumeClaim
      - PersistentVolume
      - Node
      - Image
    relation_types:
      - OWNS
      - SELECTS
      - TARGETS
      - RUNS_ON
      - MOUNTS
      - BINDS
      - REFERENCES
      - REPRESENTED_BY
      - RESOLVES_TO
      - USES_IMAGE
  web_service:
    entity_types:
      - API
      - Service
      - Job
      - Queue
      - Cache
      - Database
      - ExternalDependency
    relation_types:
      - DEPENDS_ON
      - CALLS
      - ROUTES_TO
      - PROCESSES
      - READS_FROM
      - WRITES_TO
  fintech:
    status: optional-projector-not-active-domain
    entity_types:
      - Request
      - Transaction
      - Gateway
      - LedgerState
      - SettlementJob
    relation_types:
      - ROUTES_TO
      - PROCESSES
      - READS_FROM
      - WRITES_TO

temporal_semantics:
  snapshot:
    merge_only_consecutive_equal_state: true
    on_same_state_hash:
      - update_observed_at
      - merge_evidence_ids
    on_changed_state_hash:
      - close_previous_interval
      - create_new_snapshot_interval
  relation:
    identity_fields:
      - source_entity_id
      - relation_type
      - destination_entity_id
      - reference_key
      - projector
    on_same_relation:
      - update_observed_at
      - merge_evidence_ids
    on_disappearance: close_interval
    on_reappearance: create_new_interval
  complete_set_reconciliation:
    authoritative_scope:
      - trusted_cluster_id
      - exact_namespace
      - exact_resource_roots
      - root_derived_name_prefixes
      - projector
      - managed_entity_types
      - managed_relation_types
    accepted_provider_status:
      - SUCCEEDED
    reject_before_mutation:
      - PARTIAL
      - empty_projection
      - out_of_scope_source_entity
      - projector_mismatch
      - backward_observation_time
    one_transaction:
      - upsert_current_projection
      - mark_absent_owned_entities_not_existing
      - close_absent_snapshot_intervals
      - close_absent_relation_intervals
    partial_or_failed_collection_closes_intervals: false
  event:
    identity_fields:
      - entity_id
      - event_type
      - projector_event_identity
    cumulative_source_count_uses_maximum: true

canonicalization:
  secret_values_allowed: false
  canonical_json:
    sort_keys: true
    separators: compact
    unicode: escaped
  globally_excluded:
    - raw_metric_samples
    - raw_log_lines
    - raw_trace_spans
    - raw_resource_documents
    - secret_values
    - credentials
  evidence_before_graph: true

localization:
  input: InvestigationScope
  required_bounds:
    - time_window
    - seed_entity_ids
    - max_entities
    - max_depth
  optional_bounds:
    - domains
    - relation_types
    - correlation_keys
  output: frozen-context-package
  context_completeness:
    formula: entity_coverage_times_current_incident_path_coverage
    repeated_prior_cycle_evidence_ids_in_denominator: false
    uncovered_path_requires_missing_evidence_entry: true
  adaptive_expansion:
    assessor_input: current-frozen-context-only
    expand_when_any:
      - insufficient_evidence
      - contradictory_evidence
      - competing_hypotheses
      - multi_factor_suspected
      - low_context_completeness
    allowed_changes:
      - promote_current_context_entity_to_seed
      - promote_upstream-drilldown-approved-entity-to-seed
      - increase_max_entities_within_hard_cap
      - increase_max_depth_within_hard_cap
    immutable_bounds:
      - time_window
      - domains
      - relation_types
      - correlation_keys
    audit:
      - expansion_trigger
      - scope_per_round
      - new_evidence_ids
      - stop_reason
      - budget_exhausted
    on_budget_exhaustion: abstain

retention:
  ordinary_history_hours: 72
  incident_pinned_history_days: 30
  gc_order:
    - expired_snapshot_intervals
    - expired_relation_intervals
    - expired_event_aggregates
    - expired_unreferenced_entities

persistence:
  port: StateGraphRepository
  primary_adapter: Neo4jStateGraphRepository
  target_engine: Neo4j Community
  incident_artifact_store: PostgreSQL
  graph_record_json_is_interchange_contract: true
  agent_backend_query_language_access: false
  transaction_boundary:
    - entity_upsert
    - interval_close_or_extend
    - relation_merge
    - event_aggregate_upsert
    - placeholder_reconciliation
    - complete_set_disappearance_reconciliation
