schema_version: "1.0.0"

decision:
  cloud: gcp
  status: architecture-confirmed
  confirmed_at: "2026-08-20"
  location: input-required
  compute_service: compute-engine
  kubernetes_service: self-managed
  kubernetes_distribution: upstream
  bootstrap_tool: kubeadm
  cluster_availability: single-node-dev
  container_runtime: containerd
  dataplane: cilium
  network_observability: hubble
  cloud_identity: dedicated-vm-service-account
  remote_state_backend: gcs

design_capabilities:
  terraform_google_provider:
    status: verified
    evidence_url: https://registry.terraform.io/providers/hashicorp/google/latest/docs

  compute_engine_vm:
    status: verified
    evidence_url: https://cloud.google.com/compute/docs/instances

  kubeadm_bootstrap:
    status: verified
    evidence_url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/

  cilium_hubble:
    status: verified
    evidence_url: https://docs.cilium.io/en/stable/observability/hubble/

  dedicated_vm_service_account:
    status: verified
    evidence_url: https://cloud.google.com/compute/docs/access/service-accounts

  gcs_remote_state:
    status: verified
    evidence_url: https://developer.hashicorp.com/terraform/language/backend/gcs

runtime_inputs:
  target_project:
    status: pending-user-input
    required_evidence:
      - project_id

  billing:
    status: pending-runtime-verification
    required_evidence:
      - billing_enabled
      - budget_alert_configured

  location_and_quota:
    status: pending-user-input
    required_evidence:
      - region
      - zone
      - compute_quota

  local_authentication:
    status: pending-runtime-verification
    required_evidence:
      - application_default_credentials_or_service_account_impersonation

  required_apis:
    status: pending-bootstrap
    required_evidence:
      - serviceusage_googleapis_com
      - compute_googleapis_com
      - iam_googleapis_com

  remote_state_bucket:
    status: pending-bootstrap
    required_evidence:
      - preexisting_gcs_bucket
      - object_versioning
      - least_privilege_iam

gates:
  environment_design:
    status: ready
    required_capabilities:
      - terraform_google_provider
      - compute_engine_vm
      - kubeadm_bootstrap
      - cilium_hubble
      - dedicated_vm_service_account
      - gcs_remote_state

  terraform_plan_apply:
    status: blocked
    required_runtime_inputs:
      - target_project
      - billing
      - location_and_quota
      - local_authentication
      - required_apis
      - remote_state_bucket
