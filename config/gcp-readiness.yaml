schema_version: "1.0.0"

decision:
  cloud: gcp
  status: architecture-confirmed
  confirmed_at: "2026-08-20"
  location: asia-northeast3
  compute_service: compute-engine
  kubernetes_service: self-managed
  kubernetes_distribution: upstream
  bootstrap_tool: kubeadm
  cluster_availability: single-node-dev
  container_runtime: containerd
  dataplane: cilium
  network_observability: hubble
  cloud_identity: dedicated-vm-service-account
  remote_state_backend: gcs

design_capabilities:
  terraform_google_provider:
    status: verified
    evidence_url: https://registry.terraform.io/providers/hashicorp/google/latest/docs

  compute_engine_vm:
    status: verified
    evidence_url: https://cloud.google.com/compute/docs/instances

  kubeadm_bootstrap:
    status: verified
    evidence_url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/

  cilium_hubble:
    status: verified
    evidence_url: https://docs.cilium.io/en/stable/observability/hubble/

  dedicated_vm_service_account:
    status: verified
    evidence_url: https://cloud.google.com/compute/docs/access/service-accounts

  gcs_remote_state:
    status: verified
    evidence_url: https://developer.hashicorp.com/terraform/language/backend/gcs

runtime_inputs:
  target_project:
    status: verified
    verified_at: "2026-08-22"
    required_evidence:
      - active_project_selected_without_repository_identifier

  billing:
    status: verified
    verified_at: "2026-08-22"
    required_evidence:
      - billing_enabled
    non_blocking_observations:
      - budget_alert_not_configured

  location_and_quota:
    status: verified
    verified_at: "2026-08-22"
    required_evidence:
      - asia_northeast3_region_up
      - asia_northeast3_a_zone_up
      - e2_cpu_and_address_quota_available

  local_authentication:
    status: verified
    verified_at: "2026-08-22"
    required_evidence:
      - application_default_credentials
    non_blocking_observations:
      - dedicated_terraform_impersonation_not_configured

  required_apis:
    status: verified
    verified_at: "2026-08-22"
    required_evidence:
      - serviceusage_googleapis_com
      - compute_googleapis_com
      - iam_googleapis_com
      - storage_googleapis_com
      - cloudresourcemanager_googleapis_com

  remote_state_bucket:
    status: verified
    verified_at: "2026-08-22"
    required_evidence:
      - preexisting_gcs_bucket
      - object_versioning
      - uniform_bucket_level_access
      - public_access_prevention
      - environment_state_object
    non_blocking_observations:
      - operator_access_inherited_from_project_iam

gates:
  environment_design:
    status: ready
    required_capabilities:
      - terraform_google_provider
      - compute_engine_vm
      - kubeadm_bootstrap
      - cilium_hubble
      - dedicated_vm_service_account
      - gcs_remote_state

  terraform_plan_apply:
    status: ready
    required_runtime_inputs:
      - target_project
      - billing
      - location_and_quota
      - local_authentication
      - required_apis
      - remote_state_bucket
