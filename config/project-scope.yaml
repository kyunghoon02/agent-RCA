schema_version: "1.0.0"

target:
  application: google-online-boutique
  namespace: online-boutique
  release_tag: v0.10.6
  commit_sha: 5b3a712ab85ccb8f6f7cd5b720d36ba9a8d041eb

execution_target:
  cloud: gcp
  location: asia-northeast3
  provisioning_status: gcp-foundation-applied-kubernetes-observability-verified
  compute_service: compute-engine
  kubernetes_service: self-managed
  kubernetes_distribution: upstream
  bootstrap_tool: kubeadm
  cluster_availability: single-node-dev
  container_runtime: containerd
  dataplane: cilium
  network_observability: hubble
  cloud_identity: dedicated-vm-service-account

runtime_topology:
  model: three-independent-failure-domains
  domains:
    rca-control:
      kubernetes_version: v1.36.4
      responsibilities:
        - incident-and-work-queue
        - evidence-and-agent-workers
        - stategraph
        - readonly-viewer
    fault-target:
      kubernetes_version: v1.35.8
      responsibilities:
        - online-boutique
        - chaos-mesh
        - kubernetes-and-cilium-evidence
        - telemetry-forwarding
    observability:
      kubernetes_version: v1.36.4
      responsibilities:
        - prometheus-and-alertmanager
        - loki-and-tempo
        - grafana
  transport: private-vpc-tag-scoped-firewall

platform_namespaces:
  - incident-platform
  - observability
  - graph-rca
  - load-test

service_chains:
  - id: checkout-payment
    services:
      - frontend
      - checkoutservice
      - paymentservice
    priority: primary
    application_dependency_source: pinned-online-boutique-manifest
  - id: recommendation-catalog
    services:
      - frontend
      - recommendationservice
      - productcatalogservice
    priority: secondary
    application_dependency_source: pinned-online-boutique-manifest

primary_evidence:
  - prometheus-metrics
  - application-and-container-logs
  - kubernetes-events
  - kubernetes-resource-state
  - deployment-history
  - incident-state-diff

secondary_evidence:
  - opentelemetry-traces
  - cilium-hubble-network-flow
  - git-or-argocd-history
  - gcp-audit-logs

excluded_from_mvp:
  - target-application-development
  - full-synergyrca-reproduction
  - full-lats-for-every-incident
  - automatic-remediation
  - arbitrary-shell-or-kubectl-exec
  - always-on-lab
  - multi-zone-ha
  - gpu-node
  - service-mesh
  - general-multi-cluster-fleet-management
  - multi-tenancy
