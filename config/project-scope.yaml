schema_version: "1.0.0"

target:
  application: google-online-boutique
  namespace: online-boutique
  release_tag: v0.10.6
  commit_sha: 5b3a712ab85ccb8f6f7cd5b720d36ba9a8d041eb

execution_target:
  cloud: kt-cloud
  zone: DX-M1
  provisioning_gate: capability-verification-required
  kubernetes_mode: self-managed-on-vm
  bootstrap_owner: ansible
  cni: cilium
  network_observability: hubble

platform_namespaces:
  - incident-platform
  - observability
  - graph-rca
  - load-test

service_chains:
  - id: checkout-payment
    services:
      - frontend
      - checkoutservice
      - paymentservice
    priority: primary
    application_dependency_source: pinned-online-boutique-manifest
  - id: recommendation-catalog
    services:
      - frontend
      - recommendationservice
      - productcatalogservice
    priority: secondary
    application_dependency_source: pinned-online-boutique-manifest

primary_evidence:
  - prometheus-metrics
  - application-and-container-logs
  - kubernetes-events
  - kubernetes-resource-state
  - deployment-history
  - incident-state-diff

secondary_evidence:
  - opentelemetry-traces
  - cilium-hubble-network-flow
  - git-or-argocd-history
  - provider-audit-logs

excluded_from_mvp:
  - target-application-development
  - full-synergyrca-reproduction
  - full-lats-for-every-incident
  - automatic-remediation
  - arbitrary-shell-or-kubectl-exec
  - always-on-lab
  - multi-zone-ha
  - gpu-node
  - service-mesh
  - multi-cluster
  - multi-tenancy
