schema_version: "1.0.0"

target:
  application: google-online-boutique
  namespace: online-boutique
  release_tag: v0.10.6
  commit_sha: 5b3a712ab85ccb8f6f7cd5b720d36ba9a8d041eb

execution_target:
  cloud: gcp
  location: input-required
  provisioning_status: design-ready-runtime-unverified
  kubernetes_service: gke
  kubernetes_mode: standard
  cluster_availability: zonal-dev
  dataplane: gke-dataplane-v2
  network_observability: gke-dataplane-v2-observability
  workload_identity: workload-identity-federation

platform_namespaces:
  - incident-platform
  - observability
  - graph-rca
  - load-test

service_chains:
  - id: checkout-payment
    services:
      - frontend
      - checkoutservice
      - paymentservice
    priority: primary
    application_dependency_source: pinned-online-boutique-manifest
  - id: recommendation-catalog
    services:
      - frontend
      - recommendationservice
      - productcatalogservice
    priority: secondary
    application_dependency_source: pinned-online-boutique-manifest

primary_evidence:
  - prometheus-metrics
  - application-and-container-logs
  - kubernetes-events
  - kubernetes-resource-state
  - deployment-history
  - incident-state-diff

secondary_evidence:
  - opentelemetry-traces
  - gke-dataplane-v2-network-flow
  - git-or-argocd-history
  - gcp-audit-logs

excluded_from_mvp:
  - target-application-development
  - full-synergyrca-reproduction
  - full-lats-for-every-incident
  - automatic-remediation
  - arbitrary-shell-or-kubectl-exec
  - always-on-lab
  - multi-zone-ha
  - gpu-node
  - service-mesh
  - multi-cluster
  - multi-tenancy
