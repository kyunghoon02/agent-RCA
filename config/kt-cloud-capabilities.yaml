schema_version: "1.0.0"

decision:
  cloud: kt-cloud
  zone: DX-M1
  status: project-confirmed
  confirmed_at: "2026-08-14"
  kubernetes_mode: self-managed-on-vm
  bootstrap_owner: ansible
  cni: cilium
  network_observability: hubble

capabilities:
  dx_m1_zone_documented:
    status: documented
    evidence_url: https://manual.cloud.kt.com/kt/storagecdn-nas-howto
    note: Official documentation names DX-M1, but does not establish tenant API compatibility.

  tenant_openstack_identity_api:
    status: pending-verification
    required_evidence:
      - authentication_endpoint
      - authentication_method
      - region_name
      - project_and_domain_semantics

  terraform_openstack_provider_compatibility:
    status: pending-verification
    depends_on:
      - tenant_openstack_identity_api
    required_evidence:
      - authenticated_provider_smoke_test
      - supported_resource_matrix

  compute_api:
    status: pending-verification
    required_evidence:
      - image_catalog
      - flavor_catalog
      - server_create_and_delete_smoke_test
      - quota

  network_api:
    status: pending-verification
    required_evidence:
      - network_and_subnet_create_smoke_test
      - security_group_support
      - router_or_external_connectivity_model
      - floating_ip_support
      - quota

  block_storage_api:
    status: pending-verification
    required_evidence:
      - volume_type_catalog
      - volume_attach_smoke_test
      - quota

  load_balancer_api:
    status: pending-verification
    required_evidence:
      - supported_or_explicitly_not_required

  remote_state_backend:
    status: pending-verification
    required_evidence:
      - backend_selection
      - locking_strategy
      - encryption_and_access_control

gates:
  terraform_implementation:
    status: blocked
    required_capabilities:
      - tenant_openstack_identity_api
      - terraform_openstack_provider_compatibility
      - compute_api
      - network_api
      - block_storage_api
      - remote_state_backend

  terraform_plan:
    status: blocked
    required_capabilities:
      - terraform_openstack_provider_compatibility
      - compute_api
      - network_api

  ansible_runtime:
    status: design-only
    required_capabilities:
      - compute_api
      - network_api
