schema_version: "1.0.0"

preconditions:
  graph_localization_required: true
  minimum_context_completeness_to_reason: 0.5
  below_minimum_action: abstain
  ground_truth_access_allowed: false
  write_tools_allowed: false

krca_api_drilldown:
  methodology: krca-api-level-drilldown-adaptation
  tuning_status: paper-aligned-fixture-defaults-runtime-validation-required
  propagation_threshold: 0.8
  significance_alpha: 0.05
  maximum_time_lag: 5
  latency_weights:
    anomaly: 0.2
    fluctuation_contribution: 0.5
    correlation: 0.3
  top_n_services: 3
  safety_cap:
    max_depth: 8
    max_evaluated_edges: 500
  feature_requirements:
    - api_dependency_identity
    - statistically_tested_failure_rate_correlation
    - latency_anomaly
    - latency_fluctuation_contribution
    - latency_correlation
    - evidence_ids
  on_missing_observability: adaptive_fallback_or_abstain
  on_budget_exhaustion: adaptive_fallback_or_abstain

adaptive_localization:
  tuning_status: fixture-defaults-runtime-validation-required
  initial_scope:
    max_entities: 20
    max_depth: 1
  expansion:
    entity_step: 20
    depth_step: 1
    max_rounds: 4
    minimum_context_completeness: 0.7
  hard_cap:
    max_entities: 100
    max_depth: 4
  expand_when_any:
    - insufficient_evidence
    - contradictory_evidence
    - competing_hypotheses_at_least_two
    - multi_factor_suspected
    - context_completeness_below_threshold
  immutable_bounds:
    - time_window
    - domains
    - relation_types
    - correlation_keys
  approved_external_seed_source: krca_next_ranked_candidates_only
  stop_when_any:
    - evidence_sufficient
    - no_new_context
    - scope_budget_exhausted
    - round_budget_exhausted
  on_budget_exhaustion: abstain_with_best_hypotheses

knowledge_retrieval:
  status: design-contract-runtime-unimplemented
  allowed_review_status:
    - approved
  allowed_document_types:
    - architecture
    - service-catalog
    - runbook
    - slo
    - tool-guide
  required_scope:
    - incident_id
    - investigation_scope
    - localized_entity_keys
    - allowed_document_types
  bounds:
    max_documents: 5
    max_characters: 12000
  evidence_separation:
    references_are_evidence: false
    require_evidence_id_for_root_cause: true
  prohibited_sources:
    - evaluation-ground-truth
    - fault-injection-answer
    - unverified-agent-output
    - secret-or-credential
  incident_memory:
    enabled: false
    activation_requirement: verified-rca-corpus-and-evaluation-baseline

fast_path:
  when_all:
    deterministic_result: proven
    evidence_requirements_satisfied: true
    contradiction_count: 0
  llm_calls: 0

normal_path:
  when_all:
    deterministic_result: not_proven
    minimum_distinct_evidence_sources: 2
    contradiction_count: 0
    minimum_context_completeness: 0.7
  single_pass_llm_calls: 1
  minimum_accepted_confidence: 0.75
  low_confidence_action: deep_path

deep_path:
  when_any:
    - normal_confidence_below: 0.75
    - contradiction_count_at_least: 1
    - competing_hypotheses_at_least: 2
    - multi_factor_suspected: true
  eligibility:
    minimum_context_completeness: 0.5
    localized_scope_required: true
    read_only_actions_only: true
  budget:
    max_depth: 6
    max_nodes: 24
    max_tool_calls: 32
    max_llm_calls: 20
    max_wall_time_seconds: 180
  stop_when_any:
    - evidence_supported_root_cause: true
    - budget_exhausted: true
    - no_new_read_only_action: true
  on_budget_exhaustion: abstain_with_best_hypotheses
