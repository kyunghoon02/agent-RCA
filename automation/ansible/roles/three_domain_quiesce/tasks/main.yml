---
- name: Require a reviewed legacy quiesce scope
  ansible.builtin.assert:
    that:
      - three_domain_quiesce_scope in ['fault-target-control-copy', 'control-workload-copy']
    fail_msg: The three-domain quiesce scope is invalid.

- name: Discover active duplicate Incident Platform deployments on the fault target
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - deployment
      - incident-worker
      - incident-agent-worker
      - incident-webhook
      - incident-viewer
      - --namespace
      - "{{ incident_platform_namespace }}"
      - --ignore-not-found
      - '--output=jsonpath={range .items[?(@.spec.replicas!=0)]}{.metadata.name}{"\n"}{end}'
  register: three_domain_target_active_deployments
  changed_when: false
  when: three_domain_quiesce_scope == 'fault-target-control-copy'

- name: Quiesce active duplicate Incident Platform deployments on the fault target
  ansible.builtin.command:
    argv: >-
      {{
        ['kubectl', '--kubeconfig', '/etc/kubernetes/admin.conf', 'scale', 'deployment']
        + three_domain_target_active_deployments.stdout_lines
        + ['--replicas=0', '--namespace', incident_platform_namespace]
      }}
  when:
    - three_domain_quiesce_scope == 'fault-target-control-copy'
    - three_domain_target_active_deployments.stdout_lines | length > 0
  changed_when: true

- name: Discover duplicate StateGraph reconciliation on the fault target
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get cronjob
    {{ incident_platform_reconciler_cronjob }}
    --namespace {{ incident_platform_namespace }} --ignore-not-found --output name
  register: three_domain_target_reconciler
  changed_when: false
  when: three_domain_quiesce_scope == 'fault-target-control-copy'

- name: Suspend duplicate StateGraph reconciliation on the fault target
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf patch cronjob
    {{ incident_platform_reconciler_cronjob }}
    --namespace {{ incident_platform_namespace }} --type merge
    --patch '{"spec":{"suspend":true}}'
  register: three_domain_target_reconciler_quiesce
  changed_when: "'no change' not in three_domain_target_reconciler_quiesce.stdout"
  when:
    - three_domain_quiesce_scope == 'fault-target-control-copy'
    - three_domain_target_reconciler.stdout | length > 0

- name: Read duplicate PostgreSQL replicas on the fault target
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get
    statefulset/{{ incident_platform_postgresql_statefulset }}
    --namespace {{ incident_platform_namespace }} --ignore-not-found
    --output jsonpath='{.spec.replicas}'
  register: three_domain_target_postgresql_replicas
  changed_when: false
  when: three_domain_quiesce_scope == 'fault-target-control-copy'

- name: Scale the duplicate durable control store to zero on the fault target
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf scale
    statefulset/{{ incident_platform_postgresql_statefulset }}
    --replicas=0 --namespace {{ incident_platform_namespace }}
  when:
    - three_domain_quiesce_scope == 'fault-target-control-copy'
    - three_domain_target_postgresql_replicas.stdout | length > 0
    - three_domain_target_postgresql_replicas.stdout | int != 0
  changed_when: true

- name: Discover the duplicate StateGraph namespace on the fault target
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get namespace
    {{ stategraph_namespace }} --ignore-not-found --output name
  register: three_domain_target_stategraph_namespace
  changed_when: false
  when: three_domain_quiesce_scope == 'fault-target-control-copy'

- name: Read duplicate StateGraph replicas on the fault target
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get
    statefulset/{{ stategraph_statefulset_name }}
    --namespace {{ stategraph_namespace }} --ignore-not-found
    --output jsonpath='{.spec.replicas}'
  register: three_domain_target_neo4j_replicas
  changed_when: false
  when:
    - three_domain_quiesce_scope == 'fault-target-control-copy'
    - three_domain_target_stategraph_namespace.stdout | length > 0

- name: Scale the duplicate StateGraph store to zero on the fault target
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf scale
    statefulset/{{ stategraph_statefulset_name }}
    --replicas=0 --namespace {{ stategraph_namespace }}
  when:
    - three_domain_quiesce_scope == 'fault-target-control-copy'
    - three_domain_target_stategraph_namespace.stdout | length > 0
    - three_domain_target_neo4j_replicas.stdout | default('') | length > 0
    - three_domain_target_neo4j_replicas.stdout | int != 0
  changed_when: true

- name: Remove the duplicate target-local RCA notification route
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf delete alertmanagerconfig
    {{ incident_platform_alertmanager_config }}
    --namespace {{ online_boutique_namespace }} --ignore-not-found
  register: three_domain_target_alert_route_remove
  changed_when: "'deleted' in three_domain_target_alert_route_remove.stdout"
  when: three_domain_quiesce_scope == 'fault-target-control-copy'

- name: Wait for duplicate fault-target control Pods to stop
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      kubectl --kubeconfig /etc/kubernetes/admin.conf get pods
      --namespace {{ incident_platform_namespace }} --output json
      | jq '[.items[] | select(.status.phase == "Running")] | length'
    executable: /bin/bash
  register: three_domain_target_control_running_pods
  changed_when: false
  until: three_domain_target_control_running_pods.stdout | int == 0
  retries: 30
  delay: 2
  when: three_domain_quiesce_scope == 'fault-target-control-copy'

- name: Read preserved fault-target control PVCs
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get pvc
    --namespace {{ incident_platform_namespace }} --output json
  register: three_domain_target_control_pvcs
  changed_when: false
  when: three_domain_quiesce_scope == 'fault-target-control-copy'

- name: Require any preserved fault-target control PVCs to remain Bound
  ansible.builtin.assert:
    that:
      - >-
        ((three_domain_target_control_pvcs.stdout | from_json)['items']
        | rejectattr('status.phase', 'equalto', 'Bound') | list | length) == 0
    fail_msg: A quiesced fault-target control PVC is no longer Bound.
  when: three_domain_quiesce_scope == 'fault-target-control-copy'

- name: Discover the control-domain Online Boutique namespace
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get namespace
    {{ online_boutique_namespace }} --ignore-not-found --output name
  register: three_domain_control_workload_namespace
  changed_when: false
  when: three_domain_quiesce_scope == 'control-workload-copy'

- name: Discover active control-domain Online Boutique deployments
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - deployments
      - --namespace
      - "{{ online_boutique_namespace }}"
      - '--output=jsonpath={range .items[?(@.spec.replicas!=0)]}{.metadata.name}{"\n"}{end}'
  register: three_domain_control_active_workload_deployments
  changed_when: false
  when:
    - three_domain_quiesce_scope == 'control-workload-copy'
    - three_domain_control_workload_namespace.stdout | length > 0

- name: Quiesce the active duplicate Online Boutique copy on the control domain
  ansible.builtin.command:
    argv: >-
      {{
        ['kubectl', '--kubeconfig', '/etc/kubernetes/admin.conf', 'scale', 'deployment']
        + three_domain_control_active_workload_deployments.stdout_lines
        + ['--replicas=0', '--namespace', online_boutique_namespace]
      }}
  when:
    - three_domain_quiesce_scope == 'control-workload-copy'
    - three_domain_control_workload_namespace.stdout | length > 0
    - three_domain_control_active_workload_deployments.stdout_lines | length > 0
  changed_when: true

- name: Wait for the duplicate control-domain workload Pods to stop
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      kubectl --kubeconfig /etc/kubernetes/admin.conf get pods
      --namespace {{ online_boutique_namespace }} --output json
      | jq '[.items[] | select(.status.phase == "Running")] | length'
    executable: /bin/bash
  register: three_domain_control_workload_running_pods
  changed_when: false
  until: three_domain_control_workload_running_pods.stdout | int == 0
  retries: 30
  delay: 2
  when:
    - three_domain_quiesce_scope == 'control-workload-copy'
    - three_domain_control_workload_namespace.stdout | length > 0
