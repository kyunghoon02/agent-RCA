---
- name: Wait for the PostgreSQL StatefulSet
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    rollout status statefulset/{{ incident_platform_postgresql_statefulset }}
    --namespace {{ incident_platform_namespace }}
    --timeout={{ incident_platform_wait_timeout }}
  changed_when: false

- name: Read the PostgreSQL StatefulSet image
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get statefulset {{ incident_platform_postgresql_statefulset }}
    --namespace {{ incident_platform_namespace }}
    --output jsonpath={.spec.template.spec.containers[0].image}
  register: incident_platform_postgresql_image
  changed_when: false

- name: Require the pinned PostgreSQL image
  ansible.builtin.assert:
    that:
      - (incident_platform.postgresql.version | string) in incident_platform_postgresql_image.stdout
      - incident_platform.postgresql.image_digest in incident_platform_postgresql_image.stdout
    fail_msg: The live PostgreSQL image does not match the pinned version and digest.

- name: Read the private PostgreSQL Service
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get service {{ incident_platform_postgresql_service }}
    --namespace {{ incident_platform_namespace }} --output json
  register: incident_platform_postgresql_service_result
  changed_when: false

- name: Require a private PostgreSQL ClusterIP Service
  ansible.builtin.assert:
    that:
      - (incident_platform_postgresql_service_result.stdout | from_json).spec.type == 'ClusterIP'
      - (incident_platform_postgresql_service_result.stdout | from_json).spec.ports | length == 1
      - (incident_platform_postgresql_service_result.stdout | from_json).spec.ports[0].port == 5432
    fail_msg: PostgreSQL must remain an internal ClusterIP Service.

- name: Read the PostgreSQL persistent volume claim
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get persistentvolumeclaim --namespace {{ incident_platform_namespace }}
    --selector app.kubernetes.io/name=postgresql --output json
  register: incident_platform_postgresql_pvcs
  changed_when: false

- name: Require one Bound PostgreSQL persistent volume claim
  ansible.builtin.assert:
    that:
      - (incident_platform_postgresql_pvcs.stdout | from_json)['items'] | length == 1
      - (incident_platform_postgresql_pvcs.stdout | from_json)['items'][0].status.phase == 'Bound'
      - >-
        (incident_platform_postgresql_pvcs.stdout | from_json)['items'][0].spec.storageClassName
        == local_path_storage_class
    fail_msg: The PostgreSQL PVC is missing, unbound, or uses the wrong StorageClass.

- name: Read the PostgreSQL Pod state
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get pod --namespace {{ incident_platform_namespace }}
    --selector app.kubernetes.io/name=postgresql --output json
  register: incident_platform_postgresql_pods
  changed_when: false

- name: Require a stable PostgreSQL container
  ansible.builtin.assert:
    that:
      - (incident_platform_postgresql_pods.stdout | from_json)['items'] | length == 1
      - >-
        (incident_platform_postgresql_pods.stdout | from_json)['items'][0].status.containerStatuses[0].ready
        | bool
      - >-
        (incident_platform_postgresql_pods.stdout | from_json)['items'][0].status.containerStatuses[0].lastState.terminated.reason
        | default('') != 'OOMKilled'
    fail_msg: The PostgreSQL container is not Ready or was OOM-killed.

- name: Wait for the Incident webhook Deployment
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    rollout status deployment/{{ incident_platform_webhook_deployment }}
    --namespace {{ incident_platform_namespace }}
    --timeout={{ incident_platform_wait_timeout }}
  changed_when: false

- name: Read the Incident webhook Deployment
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get deployment {{ incident_platform_webhook_deployment }}
    --namespace {{ incident_platform_namespace }} --output json
  register: incident_platform_webhook_deployment_result
  changed_when: false

- name: Require a private digest-pinned Incident webhook runtime
  ansible.builtin.assert:
    that:
      - (incident_platform_webhook_deployment_result.stdout | from_json).status.readyReplicas == 1
      - >-
        incident_platform.reconciler.image_digest in
        (incident_platform_webhook_deployment_result.stdout | from_json).spec.template.spec.containers[0].image
      - >-
        (incident_platform_webhook_deployment_result.stdout | from_json).spec.template.spec.serviceAccountName
        == 'incident-webhook'
      - >-
        not ((incident_platform_webhook_deployment_result.stdout | from_json).spec.template.spec.automountServiceAccountToken)
    fail_msg: The Incident webhook runtime image, readiness, or identity drifted.

- name: Read the private Incident webhook Service
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get service {{ incident_platform_webhook_service }}
    --namespace {{ incident_platform_namespace }} --output json
  register: incident_platform_webhook_service_result
  changed_when: false

- name: Require an internal-only Incident webhook Service
  ansible.builtin.assert:
    that:
      - (incident_platform_webhook_service_result.stdout | from_json).spec.type == 'ClusterIP'
      - (incident_platform_webhook_service_result.stdout | from_json).spec.ports | length == 1
      - (incident_platform_webhook_service_result.stdout | from_json).spec.ports[0].port == 8080
    fail_msg: The Incident webhook must remain an internal ClusterIP Service.

- name: Verify the Incident webhook health endpoint
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw
    /api/v1/namespaces/{{ incident_platform_namespace
    }}/services/http:{{ incident_platform_webhook_service }}:8080/proxy/healthz
  register: incident_platform_webhook_health
  changed_when: false

- name: Require a healthy bounded Incident webhook
  ansible.builtin.assert:
    that:
      - (incident_platform_webhook_health.stdout | from_json).status == 'ok'
    fail_msg: The Incident webhook health endpoint is unavailable.

- name: Wait for the Incident worker Deployment
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    rollout status deployment/{{ incident_platform_worker_deployment }}
    --namespace {{ incident_platform_namespace }}
    --timeout={{ incident_platform_wait_timeout }}
  changed_when: false

- name: Read the Incident worker Deployment
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get deployment {{ incident_platform_worker_deployment }}
    --namespace {{ incident_platform_namespace }} --output json
  register: incident_platform_worker_deployment_result
  changed_when: false

- name: Require the digest-pinned read-only Incident worker
  ansible.builtin.assert:
    that:
      - (incident_platform_worker_deployment_result.stdout | from_json).status.readyReplicas == 1
      - >-
        incident_platform.reconciler.image_digest in
        (incident_platform_worker_deployment_result.stdout | from_json).spec.template.spec.containers[0].image
      - >-
        (incident_platform_worker_deployment_result.stdout | from_json).spec.template.spec.serviceAccountName
        == 'incident-platform-reader'
      - >-
        (incident_platform_worker_deployment_result.stdout | from_json).spec.template.spec.automountServiceAccountToken
        | bool
      - >-
        (incident_platform_worker_deployment_result.stdout | from_json).spec.template.spec.containers[0].resources.requests.cpu
        == '100m'
      - >-
        ((incident_platform_worker_deployment_result.stdout | from_json).spec.template.spec.containers[0].env
        | selectattr('name', 'equalto', 'NEO4J_PASSWORD')
        | map(attribute='valueFrom.secretKeyRef.name') | first)
        == incident_platform_stategraph_secret
    fail_msg: The Incident worker image, readiness, identity, or resource boundary drifted.

- name: Read the Agent RCA Alertmanager routing resource
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get alertmanagerconfig {{ incident_platform_alertmanager_config }}
    --namespace {{ online_boutique_namespace }} --output json
  register: incident_platform_alertmanager_config_result
  changed_when: false

- name: Require bounded authenticated Alertmanager routing
  ansible.builtin.assert:
    that:
      - >-
        (incident_platform_alertmanager_config_result.stdout | from_json).spec.route.matchers
        | selectattr('name', 'equalto', 'rca_enabled')
        | selectattr('value', 'equalto', 'true')
        | list | length == 1
      - >-
        (incident_platform_alertmanager_config_result.stdout | from_json).spec.receivers[0].webhookConfigs[0].sendResolved
        | bool
      - >-
        (incident_platform_alertmanager_config_result.stdout | from_json).spec.receivers[0].webhookConfigs[0].httpConfig.authorization.credentials.name
        == incident_platform_webhook_secret
    fail_msg: Alertmanager routing is unbounded or does not use the webhook Secret.

- name: Define a controlled Alertmanager delivery probe
  ansible.builtin.set_fact:
    incident_platform_alert_verification_id: >-
      alertmanager-runtime-{{ ansible_facts.date_time.epoch }}
    incident_platform_alert_started_at: "{{ ansible_facts.date_time.iso8601 }}"
    incident_platform_alert_labels:
      alertname: AgentRCAReceiverVerification
      namespace: "{{ online_boutique_namespace }}"
      severity: warning
      service: frontend
      rca_enabled: "true"
      verification_id: >-
        alertmanager-runtime-{{ ansible_facts.date_time.epoch }}

- name: Verify Alertmanager delivery into the durable Incident repository
  block:
    - name: Start a temporary local Alertmanager port-forward
      ansible.builtin.shell: |
        set -eu
        nohup kubectl --kubeconfig /etc/kubernetes/admin.conf \
          port-forward --namespace {{ observability_namespace }} \
          service/{{ alertmanager_service_name }} \
          19093:9093 \
          >/tmp/agent-rca-alertmanager-port-forward.log 2>&1 </dev/null &
        echo $!
      args:
        executable: /bin/bash
      register: incident_platform_alertmanager_port_forward
      changed_when: true

    - name: Wait for the temporary Alertmanager endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:19093/-/ready
        method: GET
        status_code: 200
      register: incident_platform_alertmanager_ready
      changed_when: false
      until: incident_platform_alertmanager_ready.status == 200
      retries: 15
      delay: 1

    - name: Submit a controlled firing alert to Alertmanager
      ansible.builtin.uri:
        url: http://127.0.0.1:19093/api/v2/alerts
        method: POST
        body_format: json
        body: >-
          {{ [{
            'labels': incident_platform_alert_labels,
            'annotations': {
              'summary': 'Controlled Agent RCA receiver verification'
            },
            'startsAt': incident_platform_alert_started_at,
            'endsAt': '2099-01-01T00:00:00Z',
            'generatorURL': 'https://prometheus.invalid/agent-rca-verification'
          }] }}
        status_code: 200
      changed_when: true

    - name: Wait for the worker to collect and localize the controlled Incident
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - exec
          - --namespace
          - "{{ incident_platform_namespace }}"
          - statefulset/{{ incident_platform_postgresql_statefulset }}
          - --
          - /bin/sh
          - -ec
          - >-
            PGPASSWORD="$POSTGRES_PASSWORD" psql
            --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"
            --tuples-only --no-align
            --command="SELECT json_build_object(
              'incident_count', count(*),
              'analyzing_count', count(*) FILTER (WHERE status = 'ANALYZING'),
              'created_audit_count', (
                SELECT count(*) FROM incident_audit_events audit
                WHERE audit.incident_id IN (
                  SELECT incident_id FROM incidents
                  WHERE document->'alert'->'labels'->>'verification_id'
                    = '{{ incident_platform_alert_verification_id }}'
                ) AND audit.event_type = 'INCIDENT_CREATED'
              ),
              'collecting_audit_count', (
                SELECT count(*) FROM incident_audit_events audit
                WHERE audit.incident_id IN (
                  SELECT incident_id FROM incidents
                  WHERE document->'alert'->'labels'->>'verification_id'
                    = '{{ incident_platform_alert_verification_id }}'
                ) AND audit.event_type = 'STATUS_TRANSITIONED'
                  AND audit.details->>'to' = 'COLLECTING'
              ),
              'localizing_audit_count', (
                SELECT count(*) FROM incident_audit_events audit
                WHERE audit.incident_id IN (
                  SELECT incident_id FROM incidents
                  WHERE document->'alert'->'labels'->>'verification_id'
                    = '{{ incident_platform_alert_verification_id }}'
                ) AND audit.event_type = 'STATUS_TRANSITIONED'
                  AND audit.details->>'to' = 'LOCALIZING'
              ),
              'analyzing_audit_count', (
                SELECT count(*) FROM incident_audit_events audit
                WHERE audit.incident_id IN (
                  SELECT incident_id FROM incidents
                  WHERE document->'alert'->'labels'->>'verification_id'
                    = '{{ incident_platform_alert_verification_id }}'
                ) AND audit.event_type = 'STATUS_TRANSITIONED'
                  AND audit.details->>'to' = 'ANALYZING'
              ),
              'evidence_count', (
                SELECT count(*) FROM evidence_items evidence
                WHERE evidence.incident_id IN (
                  SELECT incident_id FROM incidents
                  WHERE document->'alert'->'labels'->>'verification_id'
                    = '{{ incident_platform_alert_verification_id }}'
                )
              ),
              'work_succeeded_count', (
                SELECT count(*) FROM incident_work_items work
                WHERE work.incident_id IN (
                  SELECT incident_id FROM incidents
                  WHERE document->'alert'->'labels'->>'verification_id'
                    = '{{ incident_platform_alert_verification_id }}'
                ) AND work.state = 'SUCCEEDED'
              ),
              'localization_work_succeeded_count', (
                SELECT count(*) FROM incident_localization_work_items work
                WHERE work.incident_id IN (
                  SELECT incident_id FROM incidents
                  WHERE document->'alert'->'labels'->>'verification_id'
                    = '{{ incident_platform_alert_verification_id }}'
                ) AND work.state = 'SUCCEEDED'
              ),
              'context_count', (
                SELECT count(*) FROM context_packages context
                WHERE context.incident_id IN (
                  SELECT incident_id FROM incidents
                  WHERE document->'alert'->'labels'->>'verification_id'
                    = '{{ incident_platform_alert_verification_id }}'
                )
              ),
              'context_evidence_count', (
                SELECT COALESCE(sum(jsonb_array_length(context.document->'evidence_ids')), 0)
                FROM context_packages context
                WHERE context.incident_id IN (
                  SELECT incident_id FROM incidents
                  WHERE document->'alert'->'labels'->>'verification_id'
                    = '{{ incident_platform_alert_verification_id }}'
                )
              ),
              'context_metric_evidence_count', (
                SELECT count(*)
                FROM context_packages context
                JOIN evidence_items evidence
                  ON evidence.incident_id = context.incident_id
                WHERE context.incident_id IN (
                  SELECT incident_id FROM incidents
                  WHERE document->'alert'->'labels'->>'verification_id'
                    = '{{ incident_platform_alert_verification_id }}'
                )
                  AND evidence.document->>'source' = 'prometheus'
                  AND context.document->'evidence_ids' ? evidence.evidence_id
              ),
              'context_recent_metric_evidence_count', (
                SELECT count(*)
                FROM context_packages context
                JOIN evidence_items evidence
                  ON evidence.incident_id = context.incident_id
                WHERE context.incident_id IN (
                  SELECT incident_id FROM incidents
                  WHERE document->'alert'->'labels'->>'verification_id'
                    = '{{ incident_platform_alert_verification_id }}'
                )
                  AND evidence.document->>'source' = 'prometheus'
                  AND context.document->'recent_change_evidence_ids'
                    ? evidence.evidence_id
              ),
              'context_path_count', (
                SELECT COALESCE(sum(jsonb_array_length(context.document->'state_paths')), 0)
                FROM context_packages context
                WHERE context.incident_id IN (
                  SELECT incident_id FROM incidents
                  WHERE document->'alert'->'labels'->>'verification_id'
                    = '{{ incident_platform_alert_verification_id }}'
                )
              ),
              'collector_count', COALESCE(sum(jsonb_array_length(document->'collector_statuses')), 0)
            ) FROM incidents
            WHERE document->'alert'->'labels'->>'verification_id'
              = '{{ incident_platform_alert_verification_id }}'"
      register: incident_platform_alert_delivery_result
      changed_when: false
      no_log: true
      until: >-
        ((incident_platform_alert_delivery_result.stdout | trim | from_json).incident_count | int == 1)
        and ((incident_platform_alert_delivery_result.stdout | trim | from_json).analyzing_count | int == 1)
        and ((incident_platform_alert_delivery_result.stdout | trim | from_json).work_succeeded_count | int == 1)
        and ((incident_platform_alert_delivery_result.stdout | trim | from_json).localization_work_succeeded_count | int == 1)
        and ((incident_platform_alert_delivery_result.stdout | trim | from_json).context_count | int == 1)
        and ((incident_platform_alert_delivery_result.stdout | trim | from_json).context_evidence_count | int == 5)
        and ((incident_platform_alert_delivery_result.stdout | trim | from_json).context_metric_evidence_count | int == 4)
        and ((incident_platform_alert_delivery_result.stdout | trim | from_json).evidence_count | int >= 5)
      retries: 60
      delay: 2

    - name: Decode the durable Alertmanager delivery result
      ansible.builtin.set_fact:
        incident_platform_alert_delivery: >-
          {{ incident_platform_alert_delivery_result.stdout | trim | from_json }}
      no_log: true

    - name: Require one auditable localized Incident
      ansible.builtin.assert:
        that:
          - incident_platform_alert_delivery.incident_count | int == 1
          - incident_platform_alert_delivery.analyzing_count | int == 1
          - incident_platform_alert_delivery.created_audit_count | int == 1
          - incident_platform_alert_delivery.collecting_audit_count | int == 1
          - incident_platform_alert_delivery.localizing_audit_count | int == 1
          - incident_platform_alert_delivery.analyzing_audit_count | int == 1
          - incident_platform_alert_delivery.evidence_count | int >= 5
          - incident_platform_alert_delivery.work_succeeded_count | int == 1
          - incident_platform_alert_delivery.localization_work_succeeded_count | int == 1
          - incident_platform_alert_delivery.context_count | int == 1
          - incident_platform_alert_delivery.context_evidence_count | int == 5
          - incident_platform_alert_delivery.context_metric_evidence_count | int == 4
          - incident_platform_alert_delivery.context_recent_metric_evidence_count | int == 0
          - incident_platform_alert_delivery.context_path_count | int >= 1
          - incident_platform_alert_delivery.collector_count | int == 2
        fail_msg: Alertmanager delivery, Evidence collection, or StateGraph localization was incomplete.
  always:
    - name: Resolve the controlled Alertmanager verification alert
      ansible.builtin.uri:
        url: http://127.0.0.1:19093/api/v2/alerts
        method: POST
        body_format: json
        body: >-
          {{ [{
            'labels': incident_platform_alert_labels,
            'annotations': {
              'summary': 'Controlled Agent RCA receiver verification resolved'
            },
            'startsAt': incident_platform_alert_started_at,
            'endsAt': incident_platform_alert_started_at,
            'generatorURL': 'https://prometheus.invalid/agent-rca-verification'
          }] }}
        status_code: 200
      changed_when: true
      when:
        - incident_platform_alertmanager_port_forward is defined
        - incident_platform_alertmanager_port_forward.stdout | trim is match('^[0-9]+$')

    - name: Stop the temporary Alertmanager port-forward
      ansible.builtin.command:
        argv:
          - kill
          - --
          - "{{ incident_platform_alertmanager_port_forward.stdout | trim }}"
      changed_when: true
      failed_when: false
      when:
        - incident_platform_alertmanager_port_forward is defined
        - incident_platform_alertmanager_port_forward.stdout | trim is match('^[0-9]+$')

    - name: Remove the temporary Alertmanager port-forward log
      ansible.builtin.file:
        path: /tmp/agent-rca-alertmanager-port-forward.log
        state: absent

- name: Read the StateGraph reconciler CronJob
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get cronjob {{ incident_platform_reconciler_cronjob }}
    --namespace {{ incident_platform_namespace }} --output json
  register: incident_platform_reconciler_cronjob_result
  changed_when: false

- name: Require a serialized, digest-pinned reconciler schedule
  ansible.builtin.assert:
    that:
      - (incident_platform_reconciler_cronjob_result.stdout | from_json).spec.schedule == '*/5 * * * *'
      - (incident_platform_reconciler_cronjob_result.stdout | from_json).spec.concurrencyPolicy == 'Forbid'
      - not ((incident_platform_reconciler_cronjob_result.stdout | from_json).spec.suspend | default(false))
      - >-
        incident_platform.reconciler.image_digest in
        (incident_platform_reconciler_cronjob_result.stdout | from_json).spec.jobTemplate.spec.template.spec.containers[0].image
      - >-
        (incident_platform_reconciler_cronjob_result.stdout | from_json).spec.jobTemplate.spec.template.spec.serviceAccountName
        == 'incident-platform-reader'
      - >-
        (incident_platform_reconciler_cronjob_result.stdout | from_json).spec.jobTemplate.spec.template.spec.automountServiceAccountToken
        | bool
    fail_msg: The StateGraph reconciler schedule or runtime boundary drifted.

- name: Verify the reconciler can list target Pods
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf auth can-i list pods
    --namespace {{ online_boutique_namespace }}
    --as system:serviceaccount:{{ incident_platform_namespace }}:incident-platform-reader
  register: incident_platform_reader_can_list_pods
  changed_when: false
  failed_when: incident_platform_reader_can_list_pods.stdout != 'yes'

- name: Verify the reconciler cannot read Secrets
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf auth can-i get secrets
    --namespace {{ online_boutique_namespace }}
    --as system:serviceaccount:{{ incident_platform_namespace }}:incident-platform-reader
  register: incident_platform_reader_can_read_secrets
  changed_when: false
  failed_when: incident_platform_reader_can_read_secrets.stdout != 'no'

- name: Verify one serialized persistent reconciliation cycle
  block:
    - name: Suspend scheduled reconciliation during the verification cycle
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        patch cronjob {{ incident_platform_reconciler_cronjob }}
        --namespace {{ incident_platform_namespace }}
        --type merge --patch '{"spec":{"suspend":true}}'
      changed_when: true

    - name: Wait for previously scheduled reconciliation Jobs to finish
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          kubectl --kubeconfig /etc/kubernetes/admin.conf
          get jobs --namespace {{ incident_platform_namespace }}
          --selector app.kubernetes.io/name=stategraph-reconciler
          --output json
          | jq '[.items[] | select(
              ([.status.conditions[]?
              | select((.type == "Complete" or .type == "Failed")
              and .status == "True")] | length) == 0
            )] | length'
        executable: /bin/bash
      register: incident_platform_existing_reconciler_jobs
      changed_when: false
      until: incident_platform_existing_reconciler_jobs.stdout | int == 0
      retries: 48
      delay: 5

    - name: Create a one-shot reconciler verification Job
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        create job --from=cronjob/{{ incident_platform_reconciler_cronjob }}
        {{ incident_platform_reconciler_cronjob }}-verify-{{ ansible_facts.date_time.epoch }}
        --namespace {{ incident_platform_namespace }}
      register: incident_platform_reconciler_verify_job_create
      changed_when: true

    - name: Wait for the one-shot reconciler verification Job
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        wait --for=condition=complete
        job/{{ incident_platform_reconciler_cronjob }}-verify-{{ ansible_facts.date_time.epoch }}
        --namespace {{ incident_platform_namespace }}
        --timeout={{ incident_platform_wait_timeout }}
      register: incident_platform_reconciler_verify_job_wait
      changed_when: false
      failed_when: false

    - name: Read the one-shot reconciler result
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        logs job/{{ incident_platform_reconciler_cronjob }}-verify-{{ ansible_facts.date_time.epoch }}
        --namespace {{ incident_platform_namespace }}
      register: incident_platform_reconciler_verify_job_logs
      changed_when: false
      no_log: true

    - name: Decode the one-shot reconciler result
      ansible.builtin.set_fact:
        incident_platform_reconciler_result: >-
          {{ incident_platform_reconciler_verify_job_logs.stdout | from_json }}
      no_log: true

    - name: Require an applied persistent StateGraph observation
      ansible.builtin.assert:
        that:
          - incident_platform_reconciler_verify_job_wait.rc == 0
          - incident_platform_reconciler_result.status == 'APPLIED'
          - incident_platform_reconciler_result.evidence_count | int >= 10
          - incident_platform_reconciler_result.projected_record_count | int >= 10
        fail_msg: The persistent StateGraph reconciliation Job did not complete.
  always:
    - name: Resume the serialized StateGraph reconciliation schedule
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        patch cronjob {{ incident_platform_reconciler_cronjob }}
        --namespace {{ incident_platform_namespace }}
        --type merge --patch '{"spec":{"suspend":false}}'
      changed_when: true

- name: Read the durable PostgreSQL journal state
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - exec
      - --namespace
      - "{{ incident_platform_namespace }}"
      - statefulset/{{ incident_platform_postgresql_statefulset }}
      - --
      - /bin/sh
      - -ec
      - >-
        PGPASSWORD="$POSTGRES_PASSWORD" psql
        --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"
        --tuples-only --no-align
        --command="SELECT json_build_object(
          'migration_count', (SELECT count(*) FROM schema_migrations),
          'cycle_count', (SELECT count(*) FROM stategraph_observation_cycles),
          'evidence_count', (SELECT count(*) FROM stategraph_observation_evidence),
          'latest_status', (SELECT status FROM stategraph_observation_cycles ORDER BY staged_at DESC LIMIT 1)
        )"
  register: incident_platform_postgresql_journal
  changed_when: false
  no_log: true

- name: Decode the durable PostgreSQL journal state
  ansible.builtin.set_fact:
    incident_platform_postgresql_journal_result: >-
      {{ incident_platform_postgresql_journal.stdout | trim | from_json }}
  no_log: true

- name: Require all migrations and durable observation Evidence
  ansible.builtin.assert:
    that:
      - incident_platform_postgresql_journal_result.migration_count | int == 5
      - incident_platform_postgresql_journal_result.cycle_count | int >= 1
      - incident_platform_postgresql_journal_result.evidence_count | int >= 10
      - incident_platform_postgresql_journal_result.latest_status == 'APPLIED'
    fail_msg: PostgreSQL migrations or the durable observation journal are incomplete.

- name: Report the sanitized Incident Platform runtime result
  ansible.builtin.debug:
    msg:
      postgresql_status: Ready
      migration_count: >-
        {{ incident_platform_postgresql_journal_result.migration_count }}
      durable_cycle_count: >-
        {{ incident_platform_postgresql_journal_result.cycle_count }}
      durable_evidence_count: >-
        {{ incident_platform_postgresql_journal_result.evidence_count }}
      alertmanager_delivery:
        incident_count: "{{ incident_platform_alert_delivery.incident_count }}"
        analyzing_count: "{{ incident_platform_alert_delivery.analyzing_count }}"
        created_audit_count: >-
          {{ incident_platform_alert_delivery.created_audit_count }}
        evidence_count: "{{ incident_platform_alert_delivery.evidence_count }}"
        work_succeeded_count: >-
          {{ incident_platform_alert_delivery.work_succeeded_count }}
        localization_work_succeeded_count: >-
          {{ incident_platform_alert_delivery.localization_work_succeeded_count }}
        context_count: "{{ incident_platform_alert_delivery.context_count }}"
        context_evidence_count: >-
          {{ incident_platform_alert_delivery.context_evidence_count }}
        context_metric_evidence_count: >-
          {{ incident_platform_alert_delivery.context_metric_evidence_count }}
        context_recent_metric_evidence_count: >-
          {{ incident_platform_alert_delivery.context_recent_metric_evidence_count }}
        context_path_count: >-
          {{ incident_platform_alert_delivery.context_path_count }}
        collector_count: "{{ incident_platform_alert_delivery.collector_count }}"
      reconciliation:
        status: "{{ incident_platform_reconciler_result.status }}"
        evidence_count: "{{ incident_platform_reconciler_result.evidence_count }}"
        projected_record_count: >-
          {{ incident_platform_reconciler_result.projected_record_count }}
        result: "{{ incident_platform_reconciler_result.reconciliation }}"
