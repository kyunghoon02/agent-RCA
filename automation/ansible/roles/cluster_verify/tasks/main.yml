---
- name: Verify the host reached the running systemd state
  ansible.builtin.command: systemctl is-system-running
  changed_when: false

- name: Read kubeadm certificate expiration state
  ansible.builtin.command: kubeadm certs check-expiration -o json
  register: kubeadm_certificate_expiration
  changed_when: false

- name: Require present Kubernetes certificates with minimum residual lifetime
  ansible.builtin.assert:
    that:
      - not (item.missing | bool)
      - (item.residualTime | int) >= kubernetes_certificate_minimum_residual_seconds
    fail_msg: >-
      Kubernetes certificate {{ item.name }} is missing or has less than
      {{ kubernetes_certificate_minimum_residual_seconds }} seconds remaining.
  loop: >-
    {{
      (kubeadm_certificate_expiration.stdout | from_json).certificates
      + (kubeadm_certificate_expiration.stdout | from_json).certificateAuthorities
    }}
  loop_control:
    label: "{{ item.name }}"

- name: Verify the Kubernetes API readiness endpoint
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/readyz
  register: api_readiness
  changed_when: false
  failed_when: api_readiness.stdout | trim != 'ok'

- name: Wait for every node to become Ready
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    wait --for=condition=Ready nodes --all --timeout={{ cluster_wait_timeout }}
  changed_when: false

- name: Wait for CoreDNS rollout
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    --namespace kube-system rollout status deployment/coredns
    --timeout={{ cluster_wait_timeout }}
  changed_when: false

- name: Verify Cilium and Hubble component status
  ansible.builtin.command: >-
    cilium status
    --kubeconfig /etc/kubernetes/admin.conf
    --wait
    --wait-duration {{ cluster_wait_timeout }}
  changed_when: false

- name: Verify the Hubble metrics endpoint through the Kubernetes API proxy
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get --raw=/api/v1/namespaces/kube-system/services/hubble-metrics:9965/proxy/metrics
  register: hubble_metrics
  changed_when: false
  failed_when: "'hubble_' not in hubble_metrics.stdout"

- name: Read the Hubble Relay Service boundary
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get service hubble-relay --namespace kube-system --output json
  register: hubble_relay_service_result
  changed_when: false

- name: Require the configured Hubble Relay Service boundary
  ansible.builtin.assert:
    that:
      - (hubble_relay_service_result.stdout | from_json).spec.type == hubble_relay_service_type
      - (hubble_relay_service_result.stdout | from_json).spec.ports | length == 1
      - (hubble_relay_service_result.stdout | from_json).spec.ports[0].port == 80
      - >-
        hubble_relay_service_type != 'NodePort'
        or ((hubble_relay_service_result.stdout | from_json).spec.ports[0].nodePort
        == hubble_relay_node_port)
    fail_msg: The Hubble Relay exposure does not match the deployment profile.

- name: Run a read-only Hubble status query
  ansible.builtin.command: hubble status --port-forward
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Read one recent Hubble flow when available
  ansible.builtin.command: >-
    hubble observe --port-forward --last 1 --output compact
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: hubble_recent_flow
  changed_when: false
  failed_when: hubble_recent_flow.rc != 0
