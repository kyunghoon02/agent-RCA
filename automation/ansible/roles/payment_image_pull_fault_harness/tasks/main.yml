---
- name: Require explicit controlled image-pull authorization
  ansible.builtin.assert:
    that:
      - confirm_controlled_fault | default('') == 'yes'
      - controlled_fault_environment | default('') == 'development'
      - payment_image_pull_scenario.environment.class == 'development'
      - payment_image_pull_scenario.target.namespace == online_boutique_namespace
      - payment_image_pull_scenario.target.name == 'paymentservice'
      - payment_image_pull_scenario.target.container == 'server'
      - groups['fault_target'] | length == 1
      - groups['observability_domain'] | length == 1
      - groups['rca_control'] | length == 1
    fail_msg: >-
      This destructive development-only scenario requires
      CONFIRM_CONTROLLED_FAULT=yes through the Make target.

- name: Read the paymentservice Deployment before fault injection
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get deployment paymentservice
    --namespace {{ online_boutique_namespace }} --output json
  register: payment_image_pull_deployment_result
  changed_when: false

- name: Read the paymentservice Pods before fault injection
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get pods --namespace {{ online_boutique_namespace }}
    --selector app=paymentservice --output json
  register: payment_image_pull_pods_result
  changed_when: false

- name: Freeze the original paymentservice image and safety state
  ansible.builtin.set_fact:
    payment_image_pull_original_deployment: >-
      {{ payment_image_pull_deployment_result.stdout | from_json }}
    payment_image_pull_original_pods: >-
      {{ (payment_image_pull_pods_result.stdout | from_json)['items'] }}
    payment_image_pull_original_container: >-
      {{ (payment_image_pull_deployment_result.stdout | from_json).spec.template.spec.containers
      | selectattr('name', 'equalto', payment_image_pull_scenario.target.container)
      | first }}
    payment_image_pull_id: >-
      payment-image-pull-{{ ansible_facts.date_time.epoch }}
    payment_image_pull_lock_name: agent-rca-payment-image-pull-lock
    payment_image_pull_repo_root: "{{ playbook_dir }}/../../.."
    payment_image_pull_watchdog_log: /tmp/agent-rca-payment-image-pull-watchdog.log
    payment_image_pull_lock_created: false
    payment_image_pull_watchdog_started: false
    payment_image_pull_fault_applied: false
    payment_image_pull_alert_submitted: false

- name: Require an exact healthy image baseline before fault injection
  ansible.builtin.assert:
    that:
      - payment_image_pull_original_deployment.status.readyReplicas | default(0) | int == payment_image_pull_scenario.baseline.ready_replicas
      - payment_image_pull_original_deployment.status.availableReplicas | default(0) | int == payment_image_pull_scenario.baseline.ready_replicas
      - payment_image_pull_original_pods | length == 1
      - payment_image_pull_original_pods[0].status.phase == 'Running'
      - payment_image_pull_original_pods[0].status.containerStatuses[0].ready | bool
      - payment_image_pull_original_pods[0].status.containerStatuses[0].restartCount | int == payment_image_pull_scenario.baseline.fresh_pod_restart_count
      - payment_image_pull_original_container.image == payment_image_pull_scenario.baseline.image
    fail_msg: >-
      paymentservice is not at the preregistered Ready, restart-zero,
      exact-image baseline.

- name: Execute the bounded controlled image-pull experiment
  block:
    - name: Check for an existing image-pull fault lock
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get configmap {{ payment_image_pull_lock_name }}
        --namespace {{ online_boutique_namespace }}
      register: payment_image_pull_existing_lock
      changed_when: false
      failed_when: false

    - name: Check for an existing OOM fault lock
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get configmap agent-rca-checkout-oom-lock
        --namespace {{ online_boutique_namespace }}
      register: payment_image_pull_existing_oom_lock
      changed_when: false
      failed_when: false

    - name: Refuse concurrent or uncleared controlled faults
      ansible.builtin.assert:
        that:
          - payment_image_pull_existing_lock.rc != 0
          - payment_image_pull_existing_oom_lock.rc != 0
        fail_msg: >-
          A controlled-fault lock already exists. Verify workload health before
          removing a stale lock or starting another fault.

    - name: Create the image-pull fault lock
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        create configmap {{ payment_image_pull_lock_name }}
        --namespace {{ online_boutique_namespace }}
        --from-literal=run_id={{ payment_image_pull_id }}
      changed_when: true

    - name: Mark the image-pull fault lock as owned by this run
      ansible.builtin.set_fact:
        payment_image_pull_lock_created: true

    - name: Start a remote fail-safe exact-image restoration watchdog
      ansible.builtin.shell: |
        set -eu
        nohup /bin/bash -c '
          sleep {{ payment_image_pull_scenario.fault.maximum_active_seconds }}
          kubectl --kubeconfig /etc/kubernetes/admin.conf set image \
            deployment/paymentservice \
            {{ payment_image_pull_scenario.target.container }}={{ payment_image_pull_original_container.image }} \
            --namespace {{ online_boutique_namespace }} || true
          kubectl --kubeconfig /etc/kubernetes/admin.conf annotate \
            deployment/paymentservice --namespace {{ online_boutique_namespace }} \
            agent-rca.dev/controlled-fault-id- || true
          kubectl --kubeconfig /etc/kubernetes/admin.conf delete \
            configmap {{ payment_image_pull_lock_name }} \
            --namespace {{ online_boutique_namespace }} --ignore-not-found=true || true
        ' >{{ payment_image_pull_watchdog_log | quote }} 2>&1 </dev/null &
        echo $!
      args:
        executable: /bin/bash
      register: payment_image_pull_watchdog_process
      changed_when: true

    - name: Mark the image restoration watchdog as started
      ansible.builtin.set_fact:
        payment_image_pull_watchdog_started: true

    - name: Annotate the controlled image-reference change
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf annotate
        deployment/paymentservice
        --namespace {{ online_boutique_namespace }}
        agent-rca.dev/controlled-fault-id={{ payment_image_pull_id }}
        --overwrite
      changed_when: true

    - name: Apply the preregistered invalid paymentservice image
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf set image
        deployment/paymentservice
        {{ payment_image_pull_scenario.target.container }}={{ payment_image_pull_scenario.fault.image }}
        --namespace {{ online_boutique_namespace }}
      changed_when: true

    - name: Mark the invalid image as applied
      ansible.builtin.set_fact:
        payment_image_pull_fault_applied: true

    - name: Wait for a new paymentservice Pod with an image-pull waiting state
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl --kubeconfig /etc/kubernetes/admin.conf get pods \
          --namespace {{ online_boutique_namespace }} \
          --selector app=paymentservice --output json \
        | jq -c '[.items[]
          | select(any(.status.containerStatuses[]?;
              .state.waiting.reason == "ErrImagePull"
              or .state.waiting.reason == "ImagePullBackOff"))
          | {
              name: .metadata.name,
              uid: .metadata.uid,
              waiting_reason: ([.status.containerStatuses[]?
                | select(.state.waiting.reason == "ErrImagePull"
                  or .state.waiting.reason == "ImagePullBackOff")
                | .state.waiting.reason] | first),
              image: ([.status.containerStatuses[]?.image] | first)
            }
        ] | sort_by(.name) | last // {}'
      args:
        executable: /bin/bash
      register: payment_image_pull_failed_pod_result
      changed_when: false
      until: >-
        payment_image_pull_failed_pod_result.stdout | trim | length > 2 and
        (payment_image_pull_failed_pod_result.stdout | from_json).uid | default('') | length > 0
      retries: 40
      delay: 3

    - name: Freeze the failed paymentservice Pod identity
      ansible.builtin.set_fact:
        payment_image_pull_failed_pod: >-
          {{ payment_image_pull_failed_pod_result.stdout | from_json }}

    - name: Wait for a matching real kubelet image-pull Event
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl --kubeconfig /etc/kubernetes/admin.conf get events \
          --namespace {{ online_boutique_namespace }} \
          --field-selector involvedObject.name={{ payment_image_pull_failed_pod.name }} \
          --output json \
        | jq '[.items[]
          | select(.involvedObject.uid == "{{ payment_image_pull_failed_pod.uid }}")
          | select(
              .reason == "ErrImagePull"
              or .reason == "ImagePullBackOff"
              or (.reason == "BackOff" and ((.message // "") | ascii_downcase | contains("pulling image")))
              or ((.message // "") | contains("ErrImagePull"))
            )
        ] | length'
      args:
        executable: /bin/bash
      register: payment_image_pull_event_result
      changed_when: false
      until: payment_image_pull_event_result.stdout | trim | int > 0
      retries: 30
      delay: 2

    - name: Observe the preregistered image-pull window
      ansible.builtin.pause:
        seconds: "{{ payment_image_pull_scenario.fault.observation_seconds }}"

    - name: Read the central Alertmanager Service for image-pull evaluation
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get service {{ alertmanager_service_name }}
        --namespace {{ observability_namespace }} --output json
      delegate_to: "{{ groups['observability_domain'][0] }}"
      register: payment_image_pull_alertmanager_service
      changed_when: false

    - name: Read bounded image-pull Alertmanager timestamps
      ansible.builtin.shell: |
        set -eu
        printf '{"starts_at":"%s","ends_at":"%s"}\n' \
          "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
          "$(date -u -d '+10 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
      args:
        executable: /bin/bash
      delegate_to: "{{ groups['observability_domain'][0] }}"
      register: payment_image_pull_alert_times_result
      changed_when: false

    - name: Freeze the controlled image-pull alert payload
      ansible.builtin.set_fact:
        payment_image_pull_alert_times: >-
          {{ payment_image_pull_alert_times_result.stdout | from_json }}
        payment_image_pull_alert_labels:
          alertname: "{{ payment_image_pull_scenario.alert.name }}"
          cluster_id: "{{ cluster_name }}"
          namespace: "{{ online_boutique_namespace }}"
          severity: critical
          service: "{{ payment_image_pull_scenario.alert.service }}"
          rca_enabled: "{{ payment_image_pull_scenario.alert.rca_enabled }}"
          agent_rca_enabled: "{{ payment_image_pull_scenario.alert.agent_rca_enabled }}"
          verification_id: "{{ payment_image_pull_id }}"

    - name: Submit the controlled image-pull alert through Alertmanager
      ansible.builtin.uri:
        url: >-
          http://{{ (payment_image_pull_alertmanager_service.stdout | from_json).spec.clusterIP
          }}:9093/api/v2/alerts
        method: POST
        body_format: json
        body: >-
          {{ [{
            'labels': payment_image_pull_alert_labels,
            'annotations': {
              'summary': 'Controlled paymentservice image pull evaluation'
            },
            'startsAt': payment_image_pull_alert_times.starts_at,
            'endsAt': payment_image_pull_alert_times.ends_at,
            'generatorURL': 'https://prometheus.invalid/controlled-payment-image-pull'
          }] }}
        status_code: 200
      delegate_to: "{{ groups['observability_domain'][0] }}"
      changed_when: true

    - name: Mark the controlled image-pull alert as submitted
      ansible.builtin.set_fact:
        payment_image_pull_alert_submitted: true

    - name: Wait for a unique image-pull Frozen Context Package
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - exec
          - --namespace
          - "{{ incident_platform_namespace }}"
          - statefulset/{{ incident_platform_postgresql_statefulset }}
          - --
          - /bin/sh
          - -ec
          - >-
            PGPASSWORD="$POSTGRES_PASSWORD" psql
            --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"
            --tuples-only --no-align
            --command="SELECT CASE
              WHEN count(*) FILTER (WHERE incident.status = 'FAILED') > 0
                THEN 'FAILED'
              WHEN count(*) FILTER (
                WHERE incident.status IN ('ANALYZING', 'REPORTED', 'PARTIAL')
                  AND EXISTS (
                    SELECT 1 FROM context_packages context
                    WHERE context.incident_id = incident.incident_id
                  )
              ) = 1 THEN 'READY'
              ELSE 'WAITING'
            END FROM incidents incident
            WHERE incident.document->'alert'->'labels'->>'verification_id'
              = '{{ payment_image_pull_id }}';"
      register: payment_image_pull_context_wait
      delegate_to: "{{ groups['rca_control'][0] }}"
      changed_when: false
      until: payment_image_pull_context_wait.stdout | trim in ['READY', 'FAILED']
      retries: 40
      delay: 5

    - name: Require successful image-pull collection and localization
      ansible.builtin.assert:
        that:
          - payment_image_pull_context_wait.stdout | trim == 'READY'
        fail_msg: >-
          The controlled image-pull Incident failed before a Context Package
          was frozen.

    - name: Wait for the image-pull Agent work to reach a terminal state
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - exec
          - --namespace
          - "{{ incident_platform_namespace }}"
          - statefulset/{{ incident_platform_postgresql_statefulset }}
          - --
          - /bin/sh
          - -ec
          - >-
            PGPASSWORD="$POSTGRES_PASSWORD" psql
            --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"
            --tuples-only --no-align
            --command="WITH target AS (
              SELECT incident.incident_id, incident.status
              FROM incidents incident
              WHERE incident.document->'alert'->'labels'->>'verification_id'
                = '{{ payment_image_pull_id }}'
              ORDER BY incident.created_at DESC LIMIT 1
            ) SELECT json_build_object(
              'terminal', COALESCE(work.state IN ('SUCCEEDED', 'FAILED'), false),
              'incident_id', target.incident_id,
              'incident_status', target.status,
              'work_state', work.state,
              'work_error_code', work.last_error_code,
              'agent_status', run.document->>'status',
              'agent_reason_code', run.document->>'reason_code',
              'model', run.document->>'model',
              'usage', run.document->'usage',
              'report_status', report.document->>'status',
              'report_path', report.document->>'path',
              'report_root_cause_id', report.document->'root_cause'->>'cause_id'
            ) FROM target
            LEFT JOIN incident_analysis_work_items work
              ON work.incident_id = target.incident_id
            LEFT JOIN LATERAL (
              SELECT candidate.document FROM agent_runs candidate
              WHERE candidate.incident_id = target.incident_id
              ORDER BY candidate.started_at DESC LIMIT 1
            ) run ON true
            LEFT JOIN LATERAL (
              SELECT candidate.document FROM rca_reports candidate
              WHERE candidate.incident_id = target.incident_id
              ORDER BY candidate.generated_at DESC LIMIT 1
            ) report ON true;"
      register: payment_image_pull_agent_wait
      delegate_to: "{{ groups['rca_control'][0] }}"
      changed_when: false
      until: >-
        payment_image_pull_agent_wait.stdout | trim | length > 0 and
        (payment_image_pull_agent_wait.stdout | from_json).terminal | bool
      retries: 80
      delay: 5
      no_log: true

    - name: Decode the sanitized image-pull Agent result
      ansible.builtin.set_fact:
        payment_image_pull_agent_summary: >-
          {{ payment_image_pull_agent_wait.stdout | from_json }}
      no_log: true

    - name: Report the sanitized image-pull Agent result
      ansible.builtin.debug:
        msg:
          incident_status: "{{ payment_image_pull_agent_summary.incident_status }}"
          work_state: "{{ payment_image_pull_agent_summary.work_state }}"
          work_error_code: >-
            {{ payment_image_pull_agent_summary.work_error_code | default(none) }}
          agent_status: >-
            {{ payment_image_pull_agent_summary.agent_status | default(none) }}
          agent_reason_code: >-
            {{ payment_image_pull_agent_summary.agent_reason_code | default(none) }}
          model: "{{ payment_image_pull_agent_summary.model | default(none) }}"
          usage: "{{ payment_image_pull_agent_summary.usage | default({}) }}"
          report_status: >-
            {{ payment_image_pull_agent_summary.report_status | default(none) }}
          report_path: >-
            {{ payment_image_pull_agent_summary.report_path | default(none) }}
          report_root_cause_id: >-
            {{ payment_image_pull_agent_summary.report_root_cause_id | default(none) }}

    - name: Export the completed image-pull Incident Evidence snapshot
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - exec
          - --namespace
          - "{{ incident_platform_namespace }}"
          - statefulset/{{ incident_platform_postgresql_statefulset }}
          - --
          - /bin/sh
          - -ec
          - >-
            PGPASSWORD="$POSTGRES_PASSWORD" psql
            --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"
            --tuples-only --no-align
            --command="SELECT json_build_object(
              'incident', incident.document,
              'context', (
                SELECT context.document FROM context_packages context
                WHERE context.incident_id = incident.incident_id
                ORDER BY context.frozen_at DESC LIMIT 1
              ),
              'evidence', (
                SELECT COALESCE(json_agg(evidence.document
                  ORDER BY evidence.observed_at, evidence.evidence_id), '[]'::json)
                FROM evidence_items evidence
                WHERE evidence.incident_id = incident.incident_id
              ),
              'report', (
                SELECT report.document FROM rca_reports report
                WHERE report.incident_id = incident.incident_id
                ORDER BY report.generated_at DESC LIMIT 1
              ),
              'agent_run', (
                SELECT run.document FROM agent_runs run
                WHERE run.incident_id = incident.incident_id
                ORDER BY run.started_at DESC LIMIT 1
              )
            ) FROM incidents incident
            WHERE incident.document->'alert'->'labels'->>'verification_id'
              = '{{ payment_image_pull_id }}'
            ORDER BY incident.created_at DESC LIMIT 1;"
      register: payment_image_pull_bundle_result
      delegate_to: "{{ groups['rca_control'][0] }}"
      changed_when: false
      no_log: true

    - name: Build local-only image-pull Ground Truth and score artifacts
      ansible.builtin.command:
        argv:
          - .venv/bin/python
          - tools/build_controlled_fault_evaluation.py
          - --scenario
          - evaluation/scenarios/paymentservice-image-pull.yaml
          - --require-agent-outcome
        chdir: "{{ payment_image_pull_repo_root }}"
        stdin: "{{ payment_image_pull_bundle_result.stdout | trim }}"
      environment:
        PYTHONPATH: src
      delegate_to: localhost
      become: false
      register: payment_image_pull_evaluation_result
      changed_when: true
      no_log: true

    - name: Decode the sanitized image-pull evaluation result
      ansible.builtin.set_fact:
        payment_image_pull_evaluation_summary: >-
          {{ payment_image_pull_evaluation_result.stdout | from_json }}
      no_log: true

    - name: Report the sanitized image-pull scores
      ansible.builtin.debug:
        msg:
          evaluation_case_id: >-
            {{ payment_image_pull_evaluation_summary.evaluation_case_id }}
          agent:
            variant_id: >-
              {{ payment_image_pull_evaluation_summary.agent.variant_id }}
            prediction_outcome: >-
              {{ payment_image_pull_evaluation_summary.agent.prediction_outcome }}
            metrics: "{{ payment_image_pull_evaluation_summary.agent.metrics }}"
          deterministic_baseline:
            variant_id: >-
              {{ payment_image_pull_evaluation_summary.deterministic_baseline.variant_id }}
            prediction_outcome: >-
              {{ payment_image_pull_evaluation_summary.deterministic_baseline.prediction_outcome }}
            metrics: >-
              {{ payment_image_pull_evaluation_summary.deterministic_baseline.metrics }}

    - name: Require an honestly represented image-pull Agent outcome
      ansible.builtin.assert:
        that:
          - payment_image_pull_agent_summary.work_state in ['SUCCEEDED', 'FAILED']
          - payment_image_pull_agent_summary.agent_status in ['SUCCEEDED', 'GATE_REJECTED', 'MODEL_FAILED', 'BUDGET_EXHAUSTED']
          - >-
            payment_image_pull_agent_summary.agent_status != 'SUCCEEDED'
            or (
              payment_image_pull_agent_summary.incident_status == 'REPORTED'
              and payment_image_pull_agent_summary.agent_reason_code == 'REPORT_ACCEPTED'
              and payment_image_pull_agent_summary.report_status in ['conclusive', 'inconclusive', 'partial']
            )
          - >-
            payment_image_pull_agent_summary.agent_status == 'SUCCEEDED'
            or payment_image_pull_agent_summary.incident_status == 'FAILED'
        fail_msg: >-
          The image-pull Agent terminal state was not represented by persisted
          audit and evaluation artifacts.

  always:
    - name: Restore the exact paymentservice image
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf set image
        deployment/paymentservice
        {{ payment_image_pull_scenario.target.container }}={{ payment_image_pull_original_container.image }}
        --namespace {{ online_boutique_namespace }}
      register: payment_image_pull_restore_result
      changed_when: payment_image_pull_restore_result.rc == 0
      failed_when: false
      when: payment_image_pull_fault_applied | bool

    - name: Remove the image-pull controlled-fault annotation
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf annotate
        deployment/paymentservice
        --namespace {{ online_boutique_namespace }}
        agent-rca.dev/controlled-fault-id-
      register: payment_image_pull_annotation_cleanup
      changed_when: payment_image_pull_annotation_cleanup.rc == 0
      failed_when: false
      when: payment_image_pull_lock_created | bool

    - name: Wait for the restored paymentservice rollout
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        rollout status deployment/paymentservice
        --namespace {{ online_boutique_namespace }} --timeout=5m
      register: payment_image_pull_restore_rollout
      changed_when: false
      failed_when: false
      when: payment_image_pull_fault_applied | bool

    - name: Resolve the controlled image-pull Alertmanager alert
      ansible.builtin.uri:
        url: >-
          http://{{ (payment_image_pull_alertmanager_service.stdout | from_json).spec.clusterIP
          }}:9093/api/v2/alerts
        method: POST
        body_format: json
        body: >-
          {{ [{
            'labels': payment_image_pull_alert_labels,
            'annotations': {
              'summary': 'Controlled paymentservice image pull evaluation'
            },
            'startsAt': payment_image_pull_alert_times.starts_at,
            'endsAt': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
            'generatorURL': 'https://prometheus.invalid/controlled-payment-image-pull'
          }] }}
        status_code: 200
      delegate_to: "{{ groups['observability_domain'][0] }}"
      register: payment_image_pull_alert_resolution
      changed_when: payment_image_pull_alert_resolution.status | default(0) == 200
      failed_when: false
      when: payment_image_pull_alert_submitted | bool

    - name: Stop the exact-image restoration watchdog
      ansible.builtin.shell: |
        pid={{ payment_image_pull_watchdog_process.stdout | default('0') | trim | int }}
        if [ "$pid" -gt 1 ]; then
          kill "$pid" 2>/dev/null || true
        fi
      args:
        executable: /bin/bash
      changed_when: false
      when: payment_image_pull_watchdog_started | bool

    - name: Remove the image-pull fault lock
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete
        configmap {{ payment_image_pull_lock_name }}
        --namespace {{ online_boutique_namespace }}
        --ignore-not-found=true
      changed_when: false
      failed_when: false
      when: payment_image_pull_lock_created | bool

    - name: Remove the image-pull watchdog log
      ansible.builtin.file:
        path: "{{ payment_image_pull_watchdog_log }}"
        state: absent
      changed_when: false

    - name: Read the restored paymentservice Deployment
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf get
        deployment/paymentservice
        --namespace {{ online_boutique_namespace }} --output json
      register: payment_image_pull_restored_deployment_result
      changed_when: false
      failed_when: false
      when: payment_image_pull_fault_applied | bool

    - name: Read the restored paymentservice Pods
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf get pods
        --namespace {{ online_boutique_namespace }}
        --selector app=paymentservice --output json
      register: payment_image_pull_restored_pods_result
      changed_when: false
      failed_when: false
      when: payment_image_pull_fault_applied | bool

    - name: Require successful exact-image automatic restoration
      ansible.builtin.assert:
        that:
          - payment_image_pull_restore_result.rc | default(1) == 0
          - payment_image_pull_restore_rollout.rc | default(1) == 0
          - payment_image_pull_restored_deployment_result.rc | default(1) == 0
          - payment_image_pull_restored_pods_result.rc | default(1) == 0
          - >-
            ((payment_image_pull_restored_deployment_result.stdout | from_json).spec.template.spec.containers
            | selectattr('name', 'equalto', payment_image_pull_scenario.target.container)
            | first).image == payment_image_pull_scenario.baseline.image
          - >-
            (payment_image_pull_restored_deployment_result.stdout | from_json).status.readyReplicas
            | default(0) | int == payment_image_pull_scenario.restoration.ready_replicas
          - >-
            (payment_image_pull_restored_pods_result.stdout | from_json)['items'] | length == 1
          - >-
            (payment_image_pull_restored_pods_result.stdout | from_json)['items'][0].status.containerStatuses[0].ready | bool
          - >-
            (payment_image_pull_restored_pods_result.stdout | from_json)['items'][0].status.containerStatuses[0].restartCount
            | int == payment_image_pull_scenario.restoration.fresh_pod_restart_count
        fail_msg: >-
          paymentservice did not return to the preregistered exact-image,
          Ready, restart-zero baseline; inspect the cluster before another run.
      when: payment_image_pull_fault_applied | bool
