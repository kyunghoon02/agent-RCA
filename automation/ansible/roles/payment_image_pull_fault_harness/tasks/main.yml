---
- name: Require a registered payment image-pull scenario
  ansible.builtin.command:
    argv:
      - .venv/bin/python
      - tools/validate_evaluation_scenario.py
      - --scenario
      - "{{ payment_image_pull_scenario_path }}"
      - --family
      - kubernetes.image-pull-failure
  args:
    chdir: "{{ playbook_dir }}/../../.."
  delegate_to: localhost
  become: false
  changed_when: false

- name: Require explicit controlled image-pull authorization
  ansible.builtin.assert:
    that:
      - confirm_controlled_fault | default('') == 'yes'
      - controlled_fault_environment | default('') == 'development'
      - payment_image_pull_scenario.environment.class == 'development'
      - payment_image_pull_scenario.target.namespace == online_boutique_namespace
      - payment_image_pull_scenario.target.name == 'paymentservice'
      - payment_image_pull_scenario.target.container == 'server'
      - payment_image_pull_scenario.baseline.restart_count_policy == 'record-current'
      - payment_image_pull_scenario.restoration.restart_count_policy == 'no-increase-or-fresh-replacement'
      - groups['fault_target'] | length == 1
      - groups['observability_domain'] | length == 1
      - groups['rca_control'] | length == 1
    fail_msg: >-
      This destructive development-only scenario requires
      CONFIRM_CONTROLLED_FAULT=yes through the Make target.

- name: Read the paymentservice Deployment before fault injection
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get deployment paymentservice
    --namespace {{ online_boutique_namespace }} --output json
  register: payment_image_pull_deployment_result
  changed_when: false

- name: Read the paymentservice Pods before fault injection
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get pods --namespace {{ online_boutique_namespace }}
    --selector app=paymentservice --output json
  register: payment_image_pull_pods_result
  changed_when: false

- name: Freeze the original paymentservice image and safety state
  ansible.builtin.set_fact:
    payment_image_pull_original_deployment: >-
      {{ payment_image_pull_deployment_result.stdout | from_json }}
    payment_image_pull_original_pods: >-
      {{ (payment_image_pull_pods_result.stdout | from_json)['items'] }}
    payment_image_pull_original_container: >-
      {{ (payment_image_pull_deployment_result.stdout | from_json).spec.template.spec.containers
      | selectattr('name', 'equalto', payment_image_pull_scenario.target.container)
      | first }}
    payment_image_pull_id: >-
      {{ payment_image_pull_scenario.alert.verification_prefix
      | default('payment-image-pull') }}-{{ ansible_facts.date_time.epoch }}
    payment_image_pull_lock_name: agent-rca-payment-image-pull-lock
    payment_image_pull_watchdog_log: /tmp/agent-rca-payment-image-pull-watchdog.log
    payment_image_pull_lock_created: false
    payment_image_pull_watchdog_started: false
    payment_image_pull_fault_applied: false

- name: Require a healthy recordable image baseline before fault injection
  ansible.builtin.assert:
    that:
      - payment_image_pull_original_deployment.status.readyReplicas | default(0) | int == payment_image_pull_scenario.baseline.ready_replicas
      - payment_image_pull_original_deployment.status.availableReplicas | default(0) | int == payment_image_pull_scenario.baseline.ready_replicas
      - payment_image_pull_original_pods | length == 1
      - payment_image_pull_original_pods[0].status.phase == 'Running'
      - payment_image_pull_original_pods[0].status.containerStatuses[0].ready | bool
      - payment_image_pull_original_container.image == payment_image_pull_scenario.baseline.image
    fail_msg: >-
      paymentservice is not at the preregistered Ready, exact-image baseline.

- name: Record the paymentservice Pod identity and cumulative restart baseline
  ansible.builtin.set_fact:
    payment_image_pull_original_pod_uid: >-
      {{ payment_image_pull_original_pods[0].metadata.uid }}
    payment_image_pull_original_restart_count: >-
      {{ payment_image_pull_original_pods[0].status.containerStatuses[0].restartCount | int }}

- name: Execute the bounded controlled image-pull experiment
  block:
    - name: Check for an existing image-pull fault lock
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get configmap {{ payment_image_pull_lock_name }}
        --namespace {{ online_boutique_namespace }}
      register: payment_image_pull_existing_lock
      changed_when: false
      failed_when: false

    - name: Check for an existing OOM fault lock
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get configmap agent-rca-checkout-oom-lock
        --namespace {{ online_boutique_namespace }}
      register: payment_image_pull_existing_oom_lock
      changed_when: false
      failed_when: false

    - name: Check for an active no-fault control lock
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get configmap agent-rca-no-fault-control-lock
        --namespace {{ online_boutique_namespace }}
      register: payment_image_pull_no_fault_control_lock
      changed_when: false
      failed_when: false

    - name: Check for an active missing-ConfigMap fault lock
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get configmap agent-rca-missing-configmap-lock
        --namespace {{ online_boutique_namespace }}
      register: payment_image_pull_missing_configmap_lock
      changed_when: false
      failed_when: false

    - name: Refuse concurrent or uncleared controlled faults
      ansible.builtin.assert:
        that:
          - payment_image_pull_existing_lock.rc != 0
          - payment_image_pull_existing_oom_lock.rc != 0
          - payment_image_pull_no_fault_control_lock.rc != 0
          - payment_image_pull_missing_configmap_lock.rc != 0
        fail_msg: >-
          A controlled-fault lock already exists. Verify workload health before
          removing a stale lock or starting another fault.

    - name: Create the image-pull fault lock
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        create configmap {{ payment_image_pull_lock_name }}
        --namespace {{ online_boutique_namespace }}
        --from-literal=run_id={{ payment_image_pull_id }}
      changed_when: true

    - name: Mark the image-pull fault lock as owned by this run
      ansible.builtin.set_fact:
        payment_image_pull_lock_created: true

    - name: Start a remote fail-safe exact-image restoration watchdog
      ansible.builtin.shell: |
        set -eu
        nohup /bin/bash -c '
          sleep {{ payment_image_pull_scenario.fault.maximum_active_seconds }}
          kubectl --kubeconfig /etc/kubernetes/admin.conf set image \
            deployment/paymentservice \
            {{ payment_image_pull_scenario.target.container }}={{ payment_image_pull_original_container.image }} \
            --namespace {{ online_boutique_namespace }} || true
          kubectl --kubeconfig /etc/kubernetes/admin.conf annotate \
            deployment/paymentservice --namespace {{ online_boutique_namespace }} \
            agent-rca.dev/controlled-fault-id- || true
          kubectl --kubeconfig /etc/kubernetes/admin.conf delete \
            configmap {{ payment_image_pull_lock_name }} \
            --namespace {{ online_boutique_namespace }} --ignore-not-found=true || true
        ' >{{ payment_image_pull_watchdog_log | quote }} 2>&1 </dev/null &
        echo $!
      args:
        executable: /bin/bash
      register: payment_image_pull_watchdog_process
      changed_when: true

    - name: Mark the image restoration watchdog as started
      ansible.builtin.set_fact:
        payment_image_pull_watchdog_started: true

    - name: Annotate the controlled image-reference change
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf annotate
        deployment/paymentservice
        --namespace {{ online_boutique_namespace }}
        agent-rca.dev/controlled-fault-id={{ payment_image_pull_id }}
        --overwrite
      changed_when: true

    - name: Apply the preregistered invalid paymentservice image
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf set image
        deployment/paymentservice
        {{ payment_image_pull_scenario.target.container }}={{ payment_image_pull_scenario.fault.image }}
        --namespace {{ online_boutique_namespace }}
      changed_when: true

    - name: Mark the invalid image as applied
      ansible.builtin.set_fact:
        payment_image_pull_fault_applied: true

    - name: Wait for a new paymentservice Pod with an image-pull waiting state
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl --kubeconfig /etc/kubernetes/admin.conf get pods \
          --namespace {{ online_boutique_namespace }} \
          --selector app=paymentservice --output json \
        | jq -c '[.items[]
          | select(any(.status.containerStatuses[]?;
              .state.waiting.reason == "ErrImagePull"
              or .state.waiting.reason == "ImagePullBackOff"))
          | {
              name: .metadata.name,
              uid: .metadata.uid,
              waiting_reason: ([.status.containerStatuses[]?
                | select(.state.waiting.reason == "ErrImagePull"
                  or .state.waiting.reason == "ImagePullBackOff")
                | .state.waiting.reason] | first),
              image: ([.status.containerStatuses[]?.image] | first)
            }
        ] | sort_by(.name) | last // {}'
      args:
        executable: /bin/bash
      register: payment_image_pull_failed_pod_result
      changed_when: false
      until: >-
        payment_image_pull_failed_pod_result.stdout | trim | length > 2 and
        (payment_image_pull_failed_pod_result.stdout | from_json).uid | default('') | length > 0
      retries: 40
      delay: 3

    - name: Freeze the failed paymentservice Pod identity
      ansible.builtin.set_fact:
        payment_image_pull_failed_pod: >-
          {{ payment_image_pull_failed_pod_result.stdout | from_json }}

    - name: Wait for a matching real kubelet image-pull Event
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl --kubeconfig /etc/kubernetes/admin.conf get events \
          --namespace {{ online_boutique_namespace }} \
          --field-selector involvedObject.name={{ payment_image_pull_failed_pod.name }} \
          --output json \
        | jq '[.items[]
          | select(.involvedObject.uid == "{{ payment_image_pull_failed_pod.uid }}")
          | select(
              .reason == "ErrImagePull"
              or .reason == "ImagePullBackOff"
              or (.reason == "BackOff" and ((.message // "") | ascii_downcase | contains("pulling image")))
              or ((.message // "") | contains("ErrImagePull"))
            )
        ] | length'
      args:
        executable: /bin/bash
      register: payment_image_pull_event_result
      changed_when: false
      until: payment_image_pull_event_result.stdout | trim | int > 0
      retries: 30
      delay: 2

    - name: Observe the preregistered image-pull window
      ansible.builtin.pause:
        seconds: "{{ payment_image_pull_scenario.fault.observation_seconds }}"

    - name: Run the shared controlled-fault evaluation pipeline
      ansible.builtin.include_role:
        name: controlled_fault_evaluation
      vars:
        controlled_fault_runtime:
          run_id: "{{ payment_image_pull_id }}"
          scenario_path: "{{ payment_image_pull_scenario_path }}"
          alert:
            name: "{{ payment_image_pull_scenario.alert.name }}"
            service: "{{ payment_image_pull_scenario.alert.service }}"
            rca_enabled: "{{ payment_image_pull_scenario.alert.rca_enabled }}"
            agent_rca_enabled: "{{ payment_image_pull_scenario.alert.agent_rca_enabled }}"
          summary: >-
            {{ payment_image_pull_scenario.alert.summary
            | default('Controlled paymentservice image pull evaluation') }}
          generator_url: >-
            {{ payment_image_pull_scenario.alert.generator_url
            | default('https://prometheus.invalid/controlled-payment-image-pull') }}

  always:
    - name: Restore the exact paymentservice image
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf set image
        deployment/paymentservice
        {{ payment_image_pull_scenario.target.container }}={{ payment_image_pull_original_container.image }}
        --namespace {{ online_boutique_namespace }}
      register: payment_image_pull_restore_result
      changed_when: payment_image_pull_restore_result.rc == 0
      failed_when: false
      when: payment_image_pull_fault_applied | bool

    - name: Remove the image-pull controlled-fault annotation
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf annotate
        deployment/paymentservice
        --namespace {{ online_boutique_namespace }}
        agent-rca.dev/controlled-fault-id-
      register: payment_image_pull_annotation_cleanup
      changed_when: payment_image_pull_annotation_cleanup.rc == 0
      failed_when: false
      when: payment_image_pull_lock_created | bool

    - name: Wait for the restored paymentservice rollout
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        rollout status deployment/paymentservice
        --namespace {{ online_boutique_namespace }} --timeout=5m
      register: payment_image_pull_restore_rollout
      changed_when: false
      failed_when: false
      when: payment_image_pull_fault_applied | bool

    - name: Resolve the image-pull evaluation alert
      ansible.builtin.include_role:
        name: controlled_fault_evaluation
        tasks_from: resolve-alert
      vars:
        controlled_fault_runtime:
          summary: >-
            {{ payment_image_pull_scenario.alert.summary
            | default('Controlled paymentservice image pull evaluation') }}
          generator_url: >-
            {{ payment_image_pull_scenario.alert.generator_url
            | default('https://prometheus.invalid/controlled-payment-image-pull') }}

    - name: Stop the exact-image restoration watchdog
      ansible.builtin.shell: |
        pid={{ payment_image_pull_watchdog_process.stdout | default('0') | trim | int }}
        if [ "$pid" -gt 1 ]; then
          kill "$pid" 2>/dev/null || true
        fi
      args:
        executable: /bin/bash
      changed_when: false
      when: payment_image_pull_watchdog_started | bool

    - name: Remove the image-pull fault lock
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf delete
        configmap {{ payment_image_pull_lock_name }}
        --namespace {{ online_boutique_namespace }}
        --ignore-not-found=true
      changed_when: false
      failed_when: false
      when: payment_image_pull_lock_created | bool

    - name: Remove the image-pull watchdog log
      ansible.builtin.file:
        path: "{{ payment_image_pull_watchdog_log }}"
        state: absent
      changed_when: false

    - name: Read the restored paymentservice Deployment
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf get
        deployment/paymentservice
        --namespace {{ online_boutique_namespace }} --output json
      register: payment_image_pull_restored_deployment_result
      changed_when: false
      failed_when: false
      when: payment_image_pull_fault_applied | bool

    - name: Read the restored paymentservice Pods
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf get pods
        --namespace {{ online_boutique_namespace }}
        --selector app=paymentservice --output json
      register: payment_image_pull_restored_pods_result
      changed_when: false
      failed_when: false
      when: payment_image_pull_fault_applied | bool

    - name: Require successful exact-image automatic restoration
      ansible.builtin.assert:
        that:
          - payment_image_pull_restore_result.rc | default(1) == 0
          - payment_image_pull_restore_rollout.rc | default(1) == 0
          - payment_image_pull_restored_deployment_result.rc | default(1) == 0
          - payment_image_pull_restored_pods_result.rc | default(1) == 0
          - >-
            ((payment_image_pull_restored_deployment_result.stdout | from_json).spec.template.spec.containers
            | selectattr('name', 'equalto', payment_image_pull_scenario.target.container)
            | first).image == payment_image_pull_scenario.baseline.image
          - >-
            (payment_image_pull_restored_deployment_result.stdout | from_json).status.readyReplicas
            | default(0) | int == payment_image_pull_scenario.restoration.ready_replicas
          - >-
            (payment_image_pull_restored_pods_result.stdout | from_json)['items'] | length == 1
          - >-
            (payment_image_pull_restored_pods_result.stdout | from_json)['items'][0].status.containerStatuses[0].ready | bool
          - >-
            (
              (payment_image_pull_restored_pods_result.stdout | from_json)['items'][0].metadata.uid
              == payment_image_pull_original_pod_uid
              and
              (payment_image_pull_restored_pods_result.stdout | from_json)['items'][0].status.containerStatuses[0].restartCount
              | int == payment_image_pull_original_restart_count | int
            )
            or
            (
              (payment_image_pull_restored_pods_result.stdout | from_json)['items'][0].metadata.uid
              != payment_image_pull_original_pod_uid
              and
              (payment_image_pull_restored_pods_result.stdout | from_json)['items'][0].status.containerStatuses[0].restartCount
              | int == 0
            )
        fail_msg: >-
          paymentservice did not return to the preregistered exact-image,
          Ready, no-new-restart baseline; inspect the cluster before another run.
      when: payment_image_pull_fault_applied | bool
