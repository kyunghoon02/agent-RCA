---
- name: Require three-domain observability wiring inputs
  ansible.builtin.assert:
    that:
      - three_domain_control_source_host | length > 0
      - three_domain_target_source_host | length > 0
      - three_domain_control_private_address | length > 0
      - three_domain_target_cluster_id | length > 0
      - hostvars[three_domain_control_source_host].three_domain_webhook_token_b64 | length > 0
    fail_msg: The control webhook or fault target identity is incomplete.
  no_log: true

- name: Ensure the remote alert namespace exists
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    create namespace {{ online_boutique_namespace }}
  register: three_domain_observability_namespace_create
  changed_when: three_domain_observability_namespace_create.rc == 0
  failed_when:
    - three_domain_observability_namespace_create.rc != 0
    - "'AlreadyExists' not in three_domain_observability_namespace_create.stderr"

- name: Label the remote alert namespace as telemetry-only
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    label namespace {{ online_boutique_namespace }}
    app.kubernetes.io/part-of=agent-rca
    kyunghoon02.github.io/boundary=telemetry
    app.kubernetes.io/managed-by=ansible
    --overwrite
  register: three_domain_observability_namespace_labels
  changed_when: "'not labeled' not in three_domain_observability_namespace_labels.stdout"

- name: Reconcile the cross-domain webhook credential
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - apply
      - --filename=-
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ incident_platform_webhook_secret }}
        namespace: {{ online_boutique_namespace }}
      type: Opaque
      data:
        token: "{{ hostvars[three_domain_control_source_host].three_domain_webhook_token_b64 }}"
  register: three_domain_observability_webhook_secret_apply
  changed_when: >-
    ' created' in three_domain_observability_webhook_secret_apply.stdout
    or ' configured' in three_domain_observability_webhook_secret_apply.stdout
  no_log: true

- name: Create the remote observability wiring directory
  ansible.builtin.file:
    path: /etc/agent-rca/three-domain
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the remote Alertmanager route
  ansible.builtin.copy:
    content: >-
      {{
        lookup(
          'ansible.builtin.file',
          playbook_dir + '/../../../platform/observability/remote-alertmanager-routing.yaml'
        )
        | replace('RCA_CONTROL_PRIVATE_ADDRESS', three_domain_control_private_address)
      }}
    dest: /etc/agent-rca/three-domain/alertmanager-routing.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render the remote target alert rule
  ansible.builtin.copy:
    content: >-
      {{
        lookup(
          'ansible.builtin.file',
          playbook_dir + '/../../../platform/observability/remote-online-boutique-alerts.yaml'
        )
        | replace('FAULT_TARGET_CLUSTER_ID', three_domain_target_cluster_id)
      }}
    dest: /etc/agent-rca/three-domain/remote-online-boutique-alerts.yaml
    owner: root
    group: root
    mode: "0644"

- name: Apply the remote Alertmanager route and alert rule
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf apply
    --filename /etc/agent-rca/three-domain/alertmanager-routing.yaml
    --filename /etc/agent-rca/three-domain/remote-online-boutique-alerts.yaml
  register: three_domain_observability_resources_apply
  changed_when: >-
    ' created' in three_domain_observability_resources_apply.stdout
    or ' configured' in three_domain_observability_resources_apply.stdout

- name: Reconcile the independently managed workload event rule
  ansible.builtin.include_tasks: workload-alerts.yml

- name: Verify private connectivity to the control webhook
  ansible.builtin.uri:
    url: >-
      http://{{ three_domain_control_private_address
      }}:{{ incident_platform_webhook_node_port }}/healthz
    method: GET
    status_code: 200
    return_content: true
  register: three_domain_observability_webhook_health
  changed_when: false

- name: Require a healthy control webhook
  ansible.builtin.assert:
    that:
      - (three_domain_observability_webhook_health.content | from_json).status == 'ok'
    fail_msg: The observability domain cannot reach the private control webhook.

- name: Read the remote metric series from central Prometheus
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - --raw
      - >-
        /api/v1/namespaces/{{ observability_namespace
        }}/services/http:monitoring-kube-prometheus-prometheus:9090/proxy/api/v1/query?query=agent_rca_api_request_rate%7Bcluster_id%3D%22{{
        three_domain_target_cluster_id }}%22%7D
  register: three_domain_remote_metrics_result
  changed_when: false
  until: >-
    ((three_domain_remote_metrics_result.stdout | from_json).data.result | length) > 0
  retries: 30
  delay: 2

- name: Read one remote Online Boutique log stream from central Loki
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - --raw
      - >-
        /api/v1/namespaces/{{ observability_namespace
        }}/services/http:loki-gateway:80/proxy/loki/api/v1/query_range?query=%7Bcluster_id%3D%22{{
        three_domain_target_cluster_id }}%22%2Cnamespace%3D%22{{
        online_boutique_namespace }}%22%7D&limit=1&direction=backward
  register: three_domain_remote_logs_result
  changed_when: false
  until: >-
    ((three_domain_remote_logs_result.stdout | from_json).data.result | length) > 0
  retries: 30
  delay: 2

- name: Read one remote trace from central Tempo
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - --raw
      - >-
        /api/v1/namespaces/{{ observability_namespace
        }}/services/http:tempo:3200/proxy/api/search?q=%7B%20resource.agent_rca.cluster_id%20%3D%20%22{{
        three_domain_target_cluster_id }}%22%20%7D&limit=1
  register: three_domain_remote_traces_result
  changed_when: false
  until: >-
    ((three_domain_remote_traces_result.stdout | from_json).traces | length) > 0
  retries: 30
  delay: 2

- name: Require the exact authenticated Alertmanager route
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get alertmanagerconfig {{ incident_platform_alertmanager_config }}
    --namespace {{ online_boutique_namespace }} --output json
  register: three_domain_alertmanager_config_result
  changed_when: false

- name: Enforce the remote alert routing boundary
  ansible.builtin.assert:
    that:
      - >-
        (three_domain_alertmanager_config_result.stdout | from_json).spec.route.matchers
        | selectattr('name', 'equalto', 'rca_enabled')
        | selectattr('value', 'equalto', 'true')
        | list | length == 1
      - >-
        (three_domain_alertmanager_config_result.stdout | from_json).spec.receivers[0].webhookConfigs[0].url
        == 'http://' + three_domain_control_private_address + ':'
        + (incident_platform_webhook_node_port | string) + '/v1/alertmanager/webhook'
      - >-
        (three_domain_alertmanager_config_result.stdout | from_json).spec.receivers[0].webhookConfigs[0].httpConfig.authorization.credentials.name
        == incident_platform_webhook_secret
    fail_msg: The central Alertmanager route is unbounded or points at the wrong domain.

- name: Report sanitized three-domain telemetry proof
  ansible.builtin.debug:
    msg:
      target_cluster_id: "{{ three_domain_target_cluster_id }}"
      remote_metric_series: >-
        {{ (three_domain_remote_metrics_result.stdout | from_json).data.result | length }}
      remote_log_streams: >-
        {{ (three_domain_remote_logs_result.stdout | from_json).data.result | length }}
      remote_traces: >-
        {{ (three_domain_remote_traces_result.stdout | from_json).traces | length }}
      webhook_health: Ready
