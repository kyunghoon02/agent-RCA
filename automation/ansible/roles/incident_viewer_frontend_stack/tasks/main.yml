---
- name: Require the private Viewer frontend runtime contract
  ansible.builtin.assert:
    that:
      - incident_platform.viewer_frontend.image_tag is match('^viewer-[0-9a-f]{12}$')
      - incident_platform.viewer_frontend.image_digest is match('^sha256:[0-9a-f]{64}$')
      - incident_platform.viewer_frontend.service_type == 'ClusterIP'
      - incident_platform.viewer_frontend.port | int == 3100
    fail_msg: The Viewer frontend image or private Service contract is invalid.

- name: Require the Incident Platform namespace
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get namespace {{ incident_platform_namespace }} --output name
  changed_when: false

- name: Require the Viewer API credential Secret
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get secret {{ incident_platform_viewer_secret }}
    --namespace {{ incident_platform_namespace }} --output name
  changed_when: false
  no_log: true

- name: Read the GCP project identity for the Viewer image
  ansible.builtin.uri:
    url: http://metadata.google.internal/computeMetadata/v1/project/project-id
    headers:
      Metadata-Flavor: Google
    return_content: true
  register: incident_viewer_frontend_gcp_project
  no_log: true

- name: Read a short-lived VM token for the Viewer image
  ansible.builtin.uri:
    url: >-
      http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token
    headers:
      Metadata-Flavor: Google
    return_content: true
  register: incident_viewer_frontend_registry_token
  no_log: true

- name: Refresh the private Artifact Registry pull Secret
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - apply
      - --filename=-
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: artifact-registry
        namespace: {{ incident_platform_namespace }}
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson: >-
          {"auths":{"{{ execution_target.location }}-docker.pkg.dev":{"username":"oauth2accesstoken","password":"{{ (incident_viewer_frontend_registry_token.content | from_json).access_token }}","auth":"{{ ('oauth2accesstoken:' + (incident_viewer_frontend_registry_token.content | from_json).access_token) | b64encode }}"}}}
  register: incident_viewer_frontend_registry_secret_apply
  changed_when: >-
    ' created' in incident_viewer_frontend_registry_secret_apply.stdout
    or ' configured' in incident_viewer_frontend_registry_secret_apply.stdout
  no_log: true

- name: Create the remote Viewer frontend manifest directory
  ansible.builtin.file:
    path: "{{ incident_platform_viewer_frontend_remote_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render a digest-pinned private Viewer frontend manifest
  block:
    - name: Create a temporary local Viewer frontend overlay
      ansible.builtin.tempfile:
        state: directory
        path: "{{ playbook_dir }}/../../../platform"
        prefix: .incident-viewer-frontend-overlay-
      delegate_to: localhost
      become: false
      register: incident_viewer_frontend_overlay

    - name: Write the Viewer frontend image overlay
      ansible.builtin.copy:
        content: |
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../incident-viewer-frontend
          images:
            - name: agent-rca-viewer
              newName: {{ execution_target.location }}-docker.pkg.dev/{{ incident_viewer_frontend_gcp_project.content }}/{{ incident_platform.artifact_repository_id }}/agent-rca-viewer
              digest: {{ incident_platform.viewer_frontend.image_digest }}
        dest: "{{ incident_viewer_frontend_overlay.path }}/kustomization.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Render the pinned Viewer frontend manifest locally
      ansible.builtin.command:
        argv:
          - kubectl
          - kustomize
          - "{{ incident_viewer_frontend_overlay.path }}"
          - --load-restrictor=LoadRestrictionsNone
      delegate_to: localhost
      become: false
      register: incident_viewer_frontend_rendered_manifest
      changed_when: false
      no_log: true
  always:
    - name: Remove the temporary local Viewer frontend overlay
      ansible.builtin.file:
        path: "{{ incident_viewer_frontend_overlay.path }}"
        state: absent
      when: incident_viewer_frontend_overlay.path is defined
      delegate_to: localhost
      become: false

- name: Copy the rendered Viewer frontend manifest
  ansible.builtin.copy:
    content: "{{ incident_viewer_frontend_rendered_manifest.stdout }}\n"
    dest: "{{ incident_platform_viewer_frontend_remote_manifest }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Apply the private Viewer frontend manifest
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    apply --filename {{ incident_platform_viewer_frontend_remote_manifest }}
  register: incident_viewer_frontend_apply
  changed_when: >-
    ' created' in incident_viewer_frontend_apply.stdout
    or ' configured' in incident_viewer_frontend_apply.stdout

- name: Wait for the private Viewer frontend Deployment
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    rollout status deployment/{{ incident_platform_viewer_frontend_deployment }}
    --namespace {{ incident_platform_namespace }}
    --timeout={{ incident_platform_wait_timeout }}
  changed_when: false
