---
- name: Wait for Online Boutique deployments
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    rollout status deployment/{{ item }}
    --namespace {{ online_boutique_namespace }}
    --timeout={{ online_boutique_wait_timeout }}
  loop: "{{ online_boutique_expected_deployments }}"
  changed_when: false

- name: Read Online Boutique deployments
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get deployment --namespace {{ online_boutique_namespace }} --output json
  register: online_boutique_deployments
  changed_when: false

- name: Require the exact Online Boutique workload set
  ansible.builtin.assert:
    that:
      - >-
        ((online_boutique_deployments.stdout | from_json)['items']
        | map(attribute='metadata.name') | sort | list)
        == (online_boutique_expected_deployments | sort | list)
    fail_msg: The deployed Online Boutique workload set does not match the pinned overlay.

- name: Read Online Boutique services
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get service --namespace {{ online_boutique_namespace }} --output json
  register: online_boutique_services
  changed_when: false

- name: Require internal-only Online Boutique services
  ansible.builtin.assert:
    that:
      - >-
        ((online_boutique_services.stdout | from_json)['items']
        | map(attribute='metadata.name') | sort | list)
        == (online_boutique_expected_services | sort | list)
      - >-
        (online_boutique_services.stdout | from_json)['items']
        | rejectattr('spec.type', 'equalto', 'ClusterIP') | list | length == 0
    fail_msg: Online Boutique has a missing, unexpected, or externally exposed service.

- name: Read Online Boutique workload images
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get deployment/{{ item }} --namespace {{ online_boutique_namespace }}
    --output jsonpath='{.spec.template.spec.containers[*].image}'
  loop: "{{ online_boutique_expected_workloads }}"
  register: online_boutique_images
  changed_when: false

- name: Require pinned Online Boutique workload images
  ansible.builtin.assert:
    that:
      - >-
        (item.item == 'redis-cart' and item.stdout == online_boutique_redis_image)
        or
        (item.item in online_boutique.custom_image_digests
        and item.stdout is match(
        '^' + execution_target.location + '-docker\\.pkg\\.dev/[^/]+/'
        + online_boutique.artifact_repository_id + '/' + item.item + '@'
        + online_boutique.custom_image_digests[item.item] + '$'))
        or
        (item.item != 'redis-cart'
        and item.item not in online_boutique.custom_image_digests
        and (item.stdout | regex_search(':' + online_boutique_image_tag + '$')) is not none)
    fail_msg: "Online Boutique image is not pinned as expected: {{ item.item }}={{ item.stdout }}"
  loop: "{{ online_boutique_images.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read the OpenTelemetry Collector image
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get deployment/opentelemetrycollector --namespace {{ online_boutique_namespace }}
    --output jsonpath='{.spec.template.spec.containers[0].image}'
  register: online_boutique_otel_collector_deployed_image
  changed_when: false

- name: Require the digest-pinned OpenTelemetry Collector image
  ansible.builtin.assert:
    that:
      - >-
        online_boutique_otel_collector_deployed_image.stdout
        == online_boutique_otel_collector_image
    fail_msg: The OpenTelemetry Collector image is not pinned as expected.

- name: Read direct instrumentation settings
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - "deployment/{{ item }}"
      - --namespace
      - "{{ online_boutique_namespace }}"
      - --output
      - "jsonpath={range .spec.template.spec.containers[?(@.name=='server')].env[*]}{.name}={.value}{'\\n'}{end}"
  loop: "{{ online_boutique_instrumented_services }}"
  register: online_boutique_instrumentation_settings
  changed_when: false

- name: Require direct OTel instrumentation on the approved service set
  ansible.builtin.assert:
    that:
      - "'ENABLE_TRACING=1' in item.stdout_lines"
      - "'COLLECTOR_SERVICE_ADDR=opentelemetrycollector:4317' in item.stdout_lines"
      - "('OTEL_SERVICE_NAME=' + item.item) in item.stdout_lines"
    fail_msg: "Direct OTel instrumentation is incomplete for {{ item.item }}."
  loop: "{{ online_boutique_instrumentation_settings.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Capture Online Boutique container restart counts
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - pod
      - --namespace
      - "{{ online_boutique_namespace }}"
      - --output
      - "jsonpath={range .items[*]}{.metadata.name}{':'}{.status.containerStatuses[0].restartCount}{'\\n'}{end}"
  register: online_boutique_restart_counts_before
  changed_when: false

- name: Allow Online Boutique workloads to stabilize
  ansible.builtin.pause:
    seconds: 30

- name: Recapture Online Boutique container restart counts and termination reasons
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - pod
      - --namespace
      - "{{ online_boutique_namespace }}"
      - --output
      - "jsonpath={range .items[*]}{.metadata.name}{':'}{.status.containerStatuses[0].restartCount}{':'}{.status.containerStatuses[0].lastState.terminated.reason}{'\\n'}{end}"
  register: online_boutique_restart_state_after
  changed_when: false

- name: Require stable Online Boutique containers without OOM termination
  ansible.builtin.assert:
    that:
      - >-
        (online_boutique_restart_state_after.stdout_lines
        | map('regex_replace', ':[^:]*$', '') | list)
        == online_boutique_restart_counts_before.stdout_lines
      - "'OOMKilled' not in online_boutique_restart_state_after.stdout"
    fail_msg: An Online Boutique container is still restarting or was OOM-killed.

- name: Read Online Boutique persistent volume claims
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get persistentvolumeclaim --namespace {{ online_boutique_namespace }} --output json
  register: online_boutique_pvcs
  changed_when: false

- name: Require the target workload to remain ephemeral
  ansible.builtin.assert:
    that:
      - (online_boutique_pvcs.stdout | from_json)['items'] | length == 0
    fail_msg: Online Boutique unexpectedly created persistent storage.

- name: Verify the Online Boutique frontend through the Kubernetes API proxy
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw
    /api/v1/namespaces/{{ online_boutique_namespace
    }}/services/http:frontend:80/proxy/
  register: online_boutique_frontend
  changed_when: false
  failed_when: "'Online Boutique' not in online_boutique_frontend.stdout"

- name: Verify the OpenTelemetry Collector health endpoint
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw
    /api/v1/namespaces/{{ online_boutique_namespace
    }}/services/http:opentelemetrycollector:13133/proxy/
  register: online_boutique_otel_collector_health
  changed_when: false
  failed_when: "'Server available' not in online_boutique_otel_collector_health.stdout"

- name: Wait for Prometheus to scrape the OpenTelemetry Collector
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - --raw
      - >-
        /api/v1/namespaces/{{ observability_namespace
        }}/services/http:monitoring-kube-prometheus-prometheus:9090/proxy/api/v1/query?query=up%7Bnamespace%3D%22online-boutique%22%2Cjob%3D%22opentelemetrycollector%22%7D
  register: online_boutique_otel_target
  retries: 18
  delay: 10
  until: >-
    (online_boutique_otel_target.stdout | from_json)['data']['result'] | length > 0
    and (online_boutique_otel_target.stdout | from_json)['data']['result'][0]
    ['value'][1] == '1'
  changed_when: false

- name: Require a healthy Online Boutique telemetry target
  ansible.builtin.assert:
    that:
      - item['value'][1] == '1'
    fail_msg: Prometheus did not report the Online Boutique telemetry target as healthy.
  loop: "{{ (online_boutique_otel_target.stdout | from_json)['data']['result'] }}"
  loop_control:
    label: "{{ item['metric'].get('job', 'online-boutique') }}"

- name: Read Prometheus recording rules for live KRCA features
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - --raw
      - >-
        /api/v1/namespaces/{{ observability_namespace
        }}/services/http:monitoring-kube-prometheus-prometheus:9090/proxy/api/v1/rules?type=record
  register: online_boutique_rca_rules
  retries: 18
  delay: 10
  until: >-
    (online_boutique_rca_rules.stdout | from_json).get('status') == 'success'
    and 'agent_rca_api_request_rate' in online_boutique_rca_rules.stdout
    and 'agent_rca_api_failure_rate' in online_boutique_rca_rules.stdout
    and 'agent_rca_api_latency_p95_milliseconds' in online_boutique_rca_rules.stdout
    and 'agent_rca_api_latency_baseline_p95_milliseconds' in online_boutique_rca_rules.stdout
  changed_when: false

- name: Require healthy live KRCA recording rules
  ansible.builtin.assert:
    that:
      - >-
        (online_boutique_rca_rules.stdout | from_json)['data']['groups']
        | map(attribute='rules') | flatten
        | selectattr('name', 'equalto', item)
        | selectattr('health', 'equalto', 'ok')
        | list | length == 1
    fail_msg: "Prometheus recording rule {{ item }} is missing, duplicated, or unhealthy."
  loop:
    - agent_rca_api_request_rate
    - agent_rca_api_failure_rate
    - agent_rca_api_latency_p95_milliseconds
    - agent_rca_api_latency_baseline_p95_milliseconds

- name: Wait for span-derived RED metrics in Prometheus
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - --raw
      - >-
        /api/v1/namespaces/{{ observability_namespace
        }}/services/http:monitoring-kube-prometheus-prometheus:9090/proxy/api/v1/query?query=sum%28agent_rca_calls_total%29
  register: online_boutique_span_metrics
  retries: 24
  delay: 10
  until: >-
    (online_boutique_span_metrics.stdout | from_json)['data']['result'] | length > 0
    and ((online_boutique_span_metrics.stdout | from_json)['data']['result'][0]
    ['value'][1] | float) > 0
  changed_when: false

- name: Read application services represented by server spans
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - --raw
      - >-
        /api/v1/namespaces/{{ observability_namespace
        }}/services/http:monitoring-kube-prometheus-prometheus:9090/proxy/api/v1/query?query=count%20by%20%28service_name%29%20%28agent_rca_calls_total%7Bnamespace%3D%22online-boutique%22%2Cspan_kind%3D%22SPAN_KIND_SERVER%22%7D%29
  register: online_boutique_server_span_services
  changed_when: false

- name: Require server-span coverage for every application service
  ansible.builtin.assert:
    that:
      - >-
        ((online_boutique_server_span_services.stdout | from_json)['data']['result']
        | map(attribute='metric.service_name') | sort | list)
        == (online_boutique_instrumented_services | sort | list)
    fail_msg: One or more Online Boutique application services has no server-span coverage.

- name: Wait for a stored Online Boutique trace in Tempo
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - --raw
      - >-
        /api/v1/namespaces/{{ observability_namespace
        }}/services/http:tempo:3200/proxy/api/search?tags=service.name%3Dfrontend&limit=1
  register: online_boutique_tempo_traces
  retries: 24
  delay: 10
  until: >-
    (online_boutique_tempo_traces.stdout | from_json).get('traces', []) | length > 0
  changed_when: false

- name: Wait for one recent Online Boutique log stream in Loki
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - get
      - --raw
      - >-
        /api/v1/namespaces/{{ observability_namespace
        }}/services/http:loki:3100/proxy/loki/api/v1/query_range?query=%7Bnamespace%3D%22online-boutique%22%7D&limit=1&direction=backward
  register: loki_online_boutique_logs
  retries: 18
  delay: 10
  until: >-
    (loki_online_boutique_logs.stdout | from_json)['data']['result'] | length > 0
  changed_when: false

- name: Require normalized Online Boutique labels on Loki logs
  ansible.builtin.assert:
    that:
      - >-
        (loki_online_boutique_logs.stdout | from_json)['data']['result'][0]
        ['stream']['cluster_id'] == cluster_name
      - >-
        (loki_online_boutique_logs.stdout | from_json)['data']['result'][0]
        ['stream']['namespace'] == online_boutique_namespace
      - >-
        (loki_online_boutique_logs.stdout | from_json)['data']['result'][0]
        ['values'] | length > 0
    fail_msg: Loki did not return a normalized Online Boutique log stream.
