---
- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the pinned Kubernetes repository key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/Release.key"
    dest: "/etc/apt/keyrings/kubernetes-{{ kubernetes_minor }}.key"
    owner: root
    group: root
    mode: "0644"
    checksum: "sha256:{{ kubernetes_package_key_sha256 }}"

- name: Check for the Kubernetes dearmored keyring
  ansible.builtin.stat:
    path: "/etc/apt/keyrings/kubernetes-{{ kubernetes_minor }}.gpg"
  register: kubernetes_dearmored_key

- name: Dearmor the Kubernetes repository key
  ansible.builtin.command:
    argv:
      - gpg
      - --dearmor
      - --yes
      - --output
      - "/etc/apt/keyrings/kubernetes-{{ kubernetes_minor }}.gpg"
      - "/etc/apt/keyrings/kubernetes-{{ kubernetes_minor }}.key"
  when: not kubernetes_dearmored_key.stat.exists
  changed_when: true

- name: Configure the Kubernetes minor-version repository
  ansible.builtin.copy:
    dest: "/etc/apt/sources.list.d/kubernetes-{{ kubernetes_minor }}.list"
    owner: root
    group: root
    mode: "0644"
    content: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-{{ kubernetes_minor }}.gpg]
      https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/ /

- name: Refresh apt metadata for the Kubernetes repository
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: 300

- name: Read available Kubernetes package versions
  ansible.builtin.command: "apt-cache madison {{ item }}"
  loop:
    - kubelet
    - kubeadm
    - kubectl
  register: kubernetes_package_candidates
  changed_when: false

- name: Require the pinned Kubernetes package version
  ansible.builtin.assert:
    that:
      - kubernetes_deb_version in item.stdout
    fail_msg: >-
      {{ item.item }}={{ kubernetes_deb_version }} is not available from the
      configured {{ kubernetes_minor }} repository. Update the reviewed version
      contract instead of silently selecting another package.
  loop: "{{ kubernetes_package_candidates.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Install pinned Kubernetes packages
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_deb_version }}"
      - "kubeadm={{ kubernetes_deb_version }}"
      - "kubectl={{ kubernetes_deb_version }}"
    state: present
    allow_downgrade: true
    update_cache: true
    lock_timeout: 300

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Pin the kubelet node IP
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    owner: root
    group: root
    mode: "0644"
    content: |
      KUBELET_EXTRA_ARGS=--node-ip={{ kubernetes_node_ip }}
  notify: Restart kubelet

- name: Enable kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true

- name: Apply the kubelet configuration before kubeadm
  ansible.builtin.meta: flush_handlers

- name: Verify kubeadm client version
  ansible.builtin.command: kubeadm version -o short
  register: installed_kubeadm_version
  changed_when: false
  failed_when: installed_kubeadm_version.stdout | trim != kubernetes_version
