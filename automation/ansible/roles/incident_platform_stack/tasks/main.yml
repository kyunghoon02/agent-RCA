---
- name: Create the remote Incident Platform manifest directory
  ansible.builtin.file:
    path: "{{ incident_platform_remote_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check whether the Incident Platform namespace exists
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get namespace {{ incident_platform_namespace }}
  register: incident_platform_namespace_status
  changed_when: false
  failed_when: false

- name: Create the Incident Platform namespace
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    create namespace {{ incident_platform_namespace }}
  when: incident_platform_namespace_status.rc != 0
  changed_when: true

- name: Reconcile the Incident Platform namespace labels
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    label namespace {{ incident_platform_namespace }}
    app.kubernetes.io/part-of=agent-rca
    kyunghoon02.github.io/boundary=control
    app.kubernetes.io/managed-by=ansible
    --overwrite
  register: incident_platform_namespace_labels
  changed_when: "'not labeled' not in incident_platform_namespace_labels.stdout"

- name: Copy the Incident Platform read-only RBAC manifest
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../platform/rbac/incident-platform-readonly.yaml"
    dest: "{{ incident_platform_readonly_manifest }}"
    owner: root
    group: root
    mode: "0644"

- name: Apply the Incident Platform read-only RBAC
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    apply --filename {{ incident_platform_readonly_manifest }}
  register: incident_platform_rbac_apply
  changed_when: >-
    ' created' in incident_platform_rbac_apply.stdout
    or ' configured' in incident_platform_rbac_apply.stdout

- name: Check whether the PostgreSQL authentication Secret exists
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get secret {{ incident_platform_postgresql_secret }}
    --namespace {{ incident_platform_namespace }}
  register: incident_platform_postgresql_secret_status
  changed_when: false
  failed_when: false

- name: Generate the initial PostgreSQL password
  ansible.builtin.command: openssl rand -hex 32
  register: incident_platform_postgresql_password
  changed_when: false
  no_log: true
  when: incident_platform_postgresql_secret_status.rc != 0

- name: Create the PostgreSQL authentication Secret
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - apply
      - --filename=-
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ incident_platform_postgresql_secret }}
        namespace: {{ incident_platform_namespace }}
      type: Opaque
      stringData:
        database: agent_rca
        username: agent_rca
        password: {{ incident_platform_postgresql_password.stdout }}
  no_log: true
  changed_when: true
  when: incident_platform_postgresql_secret_status.rc != 0

- name: Check whether the Incident Viewer authentication Secret exists
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get secret {{ incident_platform_viewer_secret }}
    --namespace {{ incident_platform_namespace }}
  register: incident_platform_viewer_secret_status
  changed_when: false
  failed_when: false

- name: Generate the initial Incident Viewer PostgreSQL password
  ansible.builtin.command: openssl rand -hex 32
  register: incident_platform_viewer_postgresql_password
  changed_when: false
  no_log: true
  when: incident_platform_viewer_secret_status.rc != 0

- name: Generate the initial Incident Viewer API token
  ansible.builtin.command: openssl rand -hex 32
  register: incident_platform_viewer_api_token
  changed_when: false
  no_log: true
  when: incident_platform_viewer_secret_status.rc != 0

- name: Create the Incident Viewer authentication Secret
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - apply
      - --filename=-
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ incident_platform_viewer_secret }}
        namespace: {{ incident_platform_namespace }}
      type: Opaque
      stringData:
        api-token: {{ incident_platform_viewer_api_token.stdout | trim }}
        database: agent_rca
        postgres-username: {{ incident_platform_viewer_database_role }}
        postgres-password: {{ incident_platform_viewer_postgresql_password.stdout | trim }}
  no_log: true
  changed_when: true
  when: incident_platform_viewer_secret_status.rc != 0

- name: Check whether the Incident webhook authentication Secret exists
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get secret {{ incident_platform_webhook_secret }}
    --namespace {{ incident_platform_namespace }}
  register: incident_platform_webhook_secret_status
  changed_when: false
  failed_when: false

- name: Generate the initial Incident webhook bearer token
  ansible.builtin.command: openssl rand -hex 32
  register: incident_platform_webhook_token
  changed_when: false
  no_log: true
  when: incident_platform_webhook_secret_status.rc != 0

- name: Create the Incident webhook authentication Secret
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - apply
      - --filename=-
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ incident_platform_webhook_secret }}
        namespace: {{ incident_platform_namespace }}
      type: Opaque
      stringData:
        token: {{ incident_platform_webhook_token.stdout | trim }}
  no_log: true
  changed_when: true
  when: incident_platform_webhook_secret_status.rc != 0

- name: Read a controller OpenAI API key from the process environment
  ansible.builtin.set_fact:
    incident_platform_openai_api_key_from_environment: >-
      {{ lookup('ansible.builtin.env', 'OPENAI_API_KEY') | trim }}
  no_log: true
  when: incident_platform_agent_runtime_enabled | bool

- name: Check the ignored project env file on the controller
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../../.env"
  delegate_to: localhost
  become: false
  register: incident_platform_local_env_file
  no_log: true
  when: incident_platform_agent_runtime_enabled | bool

- name: Use the controller environment OpenAI API key
  ansible.builtin.set_fact:
    incident_platform_openai_api_key: >-
      {{ incident_platform_openai_api_key_from_environment }}
  when:
    - incident_platform_agent_runtime_enabled | bool
    - incident_platform_openai_api_key_from_environment | length > 0
  no_log: true

- name: Read the OpenAI API key from the ignored project env file
  ansible.builtin.set_fact:
    incident_platform_openai_api_key: >-
      {{ lookup(
        'ansible.builtin.ini',
        'OPENAI_API_KEY',
        type='properties',
        file=playbook_dir + '/../../../.env',
        default=''
      ) | trim }}
  when:
    - incident_platform_agent_runtime_enabled | bool
    - incident_platform_openai_api_key_from_environment | length == 0
    - incident_platform_local_env_file.stat.exists
  no_log: true

- name: Require an OpenAI API key for the Agent worker
  ansible.builtin.assert:
    that:
      - incident_platform_openai_api_key is defined
      - incident_platform_openai_api_key | length > 0
    fail_msg: >-
      OPENAI_API_KEY must exist in the controller environment or ignored project .env.
  no_log: true
  when: incident_platform_agent_runtime_enabled | bool

- name: Reconcile the Agent worker OpenAI authentication Secret
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - apply
      - --filename=-
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ incident_platform_agent_secret }}
        namespace: {{ incident_platform_namespace }}
      type: Opaque
      stringData:
        api-key: {{ incident_platform_openai_api_key | to_json }}
  register: incident_platform_agent_secret_apply
  changed_when: >-
    ' created' in incident_platform_agent_secret_apply.stdout
    or ' configured' in incident_platform_agent_secret_apply.stdout
  no_log: true
  when: incident_platform_agent_runtime_enabled | bool

- name: Read the Incident webhook authentication Secret
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get secret {{ incident_platform_webhook_secret }}
    --namespace {{ incident_platform_namespace }} --output json
  register: incident_platform_webhook_secret_result
  changed_when: false
  no_log: true

- name: Reconcile the Alertmanager namespace webhook Secret
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - apply
      - --filename=-
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ incident_platform_webhook_secret }}
        namespace: {{ online_boutique_namespace }}
      type: Opaque
      data:
        token: "{{ (incident_platform_webhook_secret_result.stdout | from_json).data.token }}"
  register: incident_platform_alertmanager_secret_apply
  changed_when: >-
    ' created' in incident_platform_alertmanager_secret_apply.stdout
    or ' configured' in incident_platform_alertmanager_secret_apply.stdout
  no_log: true

- name: Read the Neo4j runtime credential
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get secret {{ stategraph_auth_secret_name }}
    --namespace {{ stategraph_namespace }} --output json
  register: incident_platform_neo4j_secret
  changed_when: false
  no_log: true

- name: Reconcile the namespace-local Neo4j runtime Secret
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - apply
      - --filename=-
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ incident_platform_stategraph_secret }}
        namespace: {{ incident_platform_namespace }}
      type: Opaque
      data:
        neo4j-username: "{{ (((incident_platform_neo4j_secret.stdout | from_json).data.auth | b64decode).split('/', 1))[0] | b64encode }}"
        neo4j-password: "{{ (((incident_platform_neo4j_secret.stdout | from_json).data.auth | b64decode).split('/', 1))[1] | b64encode }}"
  register: incident_platform_stategraph_secret_apply
  changed_when: >-
    ' created' in incident_platform_stategraph_secret_apply.stdout
    or ' configured' in incident_platform_stategraph_secret_apply.stdout
  no_log: true

- name: Read the GCP project identity from instance metadata
  ansible.builtin.uri:
    url: http://metadata.google.internal/computeMetadata/v1/project/project-id
    headers:
      Metadata-Flavor: Google
    return_content: true
  register: incident_platform_gcp_project
  no_log: true

- name: Read a short-lived VM access token for Artifact Registry
  ansible.builtin.uri:
    url: >-
      http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token
    headers:
      Metadata-Flavor: Google
    return_content: true
  register: incident_platform_registry_token
  no_log: true

- name: Reconcile the short-lived Artifact Registry pull Secret
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - apply
      - --filename=-
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: artifact-registry
        namespace: {{ incident_platform_namespace }}
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson: >-
          {"auths":{"{{ execution_target.location }}-docker.pkg.dev":{"username":"oauth2accesstoken","password":"{{ (incident_platform_registry_token.content | from_json).access_token }}","auth":"{{ ('oauth2accesstoken:' + (incident_platform_registry_token.content | from_json).access_token) | b64encode }}"}}}
  register: incident_platform_registry_secret_apply
  changed_when: >-
    ' created' in incident_platform_registry_secret_apply.stdout
    or ' configured' in incident_platform_registry_secret_apply.stdout
  no_log: true

- name: Render a project-local, digest-pinned Incident Platform image overlay
  block:
    - name: Create a temporary local Incident Platform overlay
      ansible.builtin.tempfile:
        state: directory
        path: "{{ playbook_dir }}/../../../platform"
        prefix: .incident-platform-image-overlay-
      delegate_to: localhost
      become: false
      register: incident_platform_image_overlay

    - name: Write the digest-pinned Incident Platform image override
      ansible.builtin.copy:
        content: |
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../incident-platform
          {% if incident_platform_agent_runtime_enabled | bool %}
            - ../incident-platform/agent-worker.yaml
          {% endif %}
          configMapGenerator:
            - name: incident-worker-krca-config
              namespace: {{ incident_platform_namespace }}
              files:
                - online-boutique-krca.yaml=online-boutique-krca.yaml
          generatorOptions:
            disableNameSuffixHash: true
          images:
            - name: agent-rca-runtime
              newName: {{ execution_target.location }}-docker.pkg.dev/{{ incident_platform_gcp_project.content }}/{{ incident_platform.artifact_repository_id }}/agent-rca-runtime
              digest: {{ incident_platform.reconciler.image_digest }}
          patches:
            - target:
                group: apps
                version: v1
                kind: Deployment
                name: incident-worker
              patch: |-
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: incident-worker
                spec:
                  template:
                    metadata:
                      annotations:
                        agent-rca.io/krca-config-sha256: {{ (lookup('ansible.builtin.file', playbook_dir + '/../../../config/online-boutique-krca.yaml') | replace('cluster_id: agent-rca-dev', 'cluster_id: ' + cluster_name) | hash('sha256')) }}
                    spec:
                      containers:
                        - name: worker
                          env:
                            - name: INCIDENT_WORKER_CLUSTER_ID
                              value: {{ cluster_name }}
                          volumeMounts:
                            - name: krca-config
                              mountPath: /app/config/online-boutique-krca.yaml
                              subPath: online-boutique-krca.yaml
                              readOnly: true
                      volumes:
                        - name: krca-config
                          configMap:
                            name: incident-worker-krca-config
            - target:
                group: batch
                version: v1
                kind: CronJob
                name: stategraph-reconciler
              patch: |-
                apiVersion: batch/v1
                kind: CronJob
                metadata:
                  name: stategraph-reconciler
                spec:
                  jobTemplate:
                    spec:
                      template:
                        spec:
                          containers:
                            - name: reconciler
                              env:
                                - name: STATEGRAPH_CLUSTER_ID
                                  value: {{ cluster_name }}
        dest: "{{ incident_platform_image_overlay.path }}/kustomization.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Write the target-cluster KRCA runtime configuration
      ansible.builtin.copy:
        content: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir + '/../../../config/online-boutique-krca.yaml'
            )
            | replace('cluster_id: agent-rca-dev', 'cluster_id: ' + cluster_name)
          }}
        dest: "{{ incident_platform_image_overlay.path }}/online-boutique-krca.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Render the pinned Incident Platform manifests locally
      ansible.builtin.command:
        argv:
          - kubectl
          - kustomize
          - "{{ incident_platform_image_overlay.path }}"
          - --load-restrictor=LoadRestrictionsNone
      delegate_to: localhost
      become: false
      register: incident_platform_rendered_manifest
      changed_when: false
      no_log: true
  always:
    - name: Remove the temporary local Incident Platform overlay
      ansible.builtin.file:
        path: "{{ incident_platform_image_overlay.path }}"
        state: absent
      when: incident_platform_image_overlay.path is defined
      delegate_to: localhost
      become: false

- name: Copy the rendered Incident Platform manifest
  ansible.builtin.copy:
    content: "{{ incident_platform_rendered_manifest.stdout }}\n"
    dest: "{{ incident_platform_remote_manifest }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Apply the Incident Platform manifest
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    apply --filename {{ incident_platform_remote_manifest }}
  register: incident_platform_apply
  changed_when: >-
    ' created' in incident_platform_apply.stdout
    or ' configured' in incident_platform_apply.stdout

- name: Wait for PostgreSQL before reconciling the Viewer database role
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    rollout status statefulset/{{ incident_platform_postgresql_statefulset }}
    --namespace {{ incident_platform_namespace }}
    --timeout={{ incident_platform_wait_timeout }}
  changed_when: false

- name: Read the Incident Viewer authentication Secret
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    get secret {{ incident_platform_viewer_secret }}
    --namespace {{ incident_platform_namespace }} --output json
  register: incident_platform_viewer_secret_result
  changed_when: false
  no_log: true

- name: Reconcile the PostgreSQL SELECT-only Incident Viewer role
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - exec
      - --namespace
      - "{{ incident_platform_namespace }}"
      - statefulset/{{ incident_platform_postgresql_statefulset }}
      - --
      - env
      - >-
        VIEWER_PASSWORD={{
          (incident_platform_viewer_secret_result.stdout | from_json).data['postgres-password']
          | b64decode
        }}
      - /bin/sh
      - -ec
      - |
        PGPASSWORD="$POSTGRES_PASSWORD" psql \
          --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" \
          --set=ON_ERROR_STOP=1 --set=viewer_password="$VIEWER_PASSWORD" <<'SQL'
        SELECT format(
          'CREATE ROLE {{ incident_platform_viewer_database_role }} LOGIN PASSWORD %L',
          :'viewer_password'
        )
        WHERE NOT EXISTS (
          SELECT 1 FROM pg_roles
          WHERE rolname = '{{ incident_platform_viewer_database_role }}'
        )
        \gexec
        ALTER ROLE {{ incident_platform_viewer_database_role }}
          LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS
          PASSWORD :'viewer_password';
        ALTER ROLE {{ incident_platform_viewer_database_role }}
          SET default_transaction_read_only TO on;
        GRANT CONNECT ON DATABASE agent_rca TO {{ incident_platform_viewer_database_role }};
        REVOKE CREATE ON SCHEMA public FROM {{ incident_platform_viewer_database_role }};
        GRANT USAGE ON SCHEMA public TO {{ incident_platform_viewer_database_role }};
        REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA public
          FROM {{ incident_platform_viewer_database_role }};
        GRANT SELECT ON ALL TABLES IN SCHEMA public
          TO {{ incident_platform_viewer_database_role }};
        REVOKE ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public
          FROM {{ incident_platform_viewer_database_role }};
        ALTER DEFAULT PRIVILEGES FOR ROLE agent_rca IN SCHEMA public
          GRANT SELECT ON TABLES TO {{ incident_platform_viewer_database_role }};
        SQL
  register: incident_platform_viewer_role_reconcile
  changed_when: false
  no_log: true

- name: Wait for the PostgreSQL StatefulSet
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf
    rollout status statefulset/{{ incident_platform_postgresql_statefulset }}
    --namespace {{ incident_platform_namespace }}
    --timeout={{ incident_platform_wait_timeout }}
  changed_when: false
