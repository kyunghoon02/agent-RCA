cluster_name: agent-rca-dev

supported_distribution: Ubuntu
supported_distribution_version: "24.04"
supported_architecture: x86_64

containerd_deb_version: "2.2.1-0ubuntu1~24.04.3"
containerd_cri_socket: unix:///run/containerd/containerd.sock

kubernetes_minor: v1.36
kubernetes_version: v1.36.4
kubernetes_deb_version: 1.36.4-1.1
kubernetes_package_key_sha256: >-
  7627818cf7bae52f9008c93e8b1f961f53dea11d40891778de216fb1b43be54d
kubernetes_node_ip: "{{ ansible_facts['default_ipv4']['address'] }}"
kubernetes_admin_user: "{{ ansible_user }}"
kubernetes_pod_subnet: 10.244.0.0/16
kubernetes_service_subnet: 10.96.0.0/12
kubernetes_dns_domain: cluster.local
kubernetes_api_bind_port: 6443
kubernetes_inotify_max_user_instances: 1024
kubernetes_api_extra_sans:
  - 127.0.0.1

helm_version: v3.21.4
helm_linux_amd64_sha256: >-
  61f88ab166748cb19604d7884cb100ae9ccb13804ddeb98e08af167eacbb6a14

cilium_chart_ref: oci://quay.io/cilium/charts/cilium
cilium_chart_version: 1.20.1
cilium_cli_version: v0.19.7
cilium_cli_linux_amd64_sha256: >-
  cd15e0983bf0acc7946cd05d453d1e58376ea92dec2642e745212df2b07d8852
hubble_cli_version: v1.19.4
hubble_cli_linux_amd64_sha256: >-
  c7c37a5f27ed2ae2d5495c6ddbecc61cebbb841508e77af3c131e96f005ed247
hubble_relay_service_type: ClusterIP
hubble_relay_node_port: 31234

chaos_mesh_namespace: chaos-mesh
chaos_mesh_target_namespace: online-boutique
chaos_mesh_release_name: chaos-mesh
chaos_mesh_chart_repository_name: chaos-mesh
chaos_mesh_chart_repository_url: https://charts.chaos-mesh.org
chaos_mesh_chart_ref: chaos-mesh/chaos-mesh
chaos_mesh_chart_version: "2.8.4"
chaos_mesh_remote_directory: /etc/agent-rca/chaos-mesh
chaos_mesh_remote_values: /etc/agent-rca/chaos-mesh/values.yaml
chaos_mesh_wait_timeout: 15m

cluster_wait_timeout: 10m
kubernetes_certificate_minimum_residual_seconds: 2592000

observability_namespace: observability
observability_remote_values_directory: /etc/agent-rca/observability
observability_wait_timeout: 15m
observability_domain_mode: local
observability_remote_node_address: >-
  {{ observability_remote_node_address_inventory | default('') }}
observability_prometheus_node_port: 30090
observability_loki_node_port: 30100
observability_tempo_query_node_port: 30320
observability_tempo_otlp_grpc_node_port: 30317
observability_tempo_otlp_http_node_port: 30318
observability_prometheus_service_type: >-
  {{ 'NodePort' if observability_domain_mode == 'receiver' else 'ClusterIP' }}
observability_loki_service_type: >-
  {{ 'NodePort' if observability_domain_mode == 'receiver' else 'ClusterIP' }}
observability_prometheus_remote_write_enabled: >-
  {{ observability_domain_mode == 'forwarder' }}
observability_prometheus_remote_write_url: >-
  http://{{ observability_remote_node_address }}:{{ observability_prometheus_node_port }}/api/v1/write
observability_loki_write_url: >-
  {{
    'http://' + observability_remote_node_address + ':' + (observability_loki_node_port | string)
    + '/loki/api/v1/push'
    if observability_domain_mode == 'forwarder'
    else 'http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push'
  }}
online_boutique_tempo_endpoint: >-
  {{
    observability_remote_node_address + ':' + (observability_tempo_otlp_grpc_node_port | string)
    if observability_domain_mode == 'forwarder'
    else 'tempo.observability.svc.cluster.local:4317'
  }}

local_path_release_name: local-path-provisioner
local_path_namespace: local-path-storage
local_path_chart_ref: oci://ghcr.io/rancher/local-path-provisioner/charts/local-path-provisioner
local_path_chart_version: "0.0.36"
local_path_storage_class: agent-rca-local

kube_prometheus_release_name: monitoring
alertmanager_service_name: monitoring-kube-prometheus-alertmanager
kube_prometheus_chart_ref: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
kube_prometheus_chart_version: "88.5.3"

loki_release_name: loki
loki_chart_ref: oci://ghcr.io/grafana-community/helm-charts/loki
loki_chart_version: "18.11.0"

tempo_statefulset_name: tempo
tempo_remote_manifest: /etc/agent-rca/observability/tempo-manifest.yaml

alloy_release_name: alloy
alloy_chart_repository_name: grafana
alloy_chart_repository_url: https://grafana.github.io/helm-charts
alloy_chart_ref: grafana/alloy
alloy_chart_version: "1.11.1"

online_boutique_namespace: online-boutique
online_boutique_remote_manifest_directory: /etc/agent-rca/online-boutique
online_boutique_wait_timeout: 20m
online_boutique_image_tag: v0.10.6
online_boutique_redis_image: >-
  docker.io/library/redis@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
online_boutique_otel_collector_image: >-
  otel/opentelemetry-collector-contrib:0.155.0@sha256:4935caa35e9a4cb387e35732e8fb22b2b5759af8d12e7043357f03837f6e8df5
online_boutique_expected_workloads:
  - adservice
  - cartservice
  - checkoutservice
  - currencyservice
  - emailservice
  - frontend
  - paymentservice
  - productcatalogservice
  - recommendationservice
  - redis-cart
  - shippingservice
online_boutique_expected_deployments: >-
  {{ online_boutique_expected_workloads + ['opentelemetrycollector'] }}
online_boutique_expected_services: >-
  {{ online_boutique_expected_workloads + ['opentelemetrycollector'] }}
online_boutique_instrumented_services:
  - adservice
  - cartservice
  - checkoutservice
  - currencyservice
  - emailservice
  - frontend
  - paymentservice
  - productcatalogservice
  - recommendationservice
  - shippingservice
online_boutique_expected_rca_alerts:
  - name: OnlineBoutiqueHomeHighFailureRate
    profile: browse-home
    operation: GET /
  - name: OnlineBoutiqueProductDetailHighFailureRate
    profile: product-detail
    operation: GET /product/{id}
  - name: OnlineBoutiqueCartReadHighFailureRate
    profile: cart-read
    operation: GET /cart
  - name: OnlineBoutiqueCartAddHighFailureRate
    profile: cart-add
    operation: POST /cart
  - name: OnlineBoutiqueCartEmptyHighFailureRate
    profile: cart-empty
    operation: POST /cart/empty
  - name: OnlineBoutiqueCheckoutHighFailureRate
    profile: checkout-full
    operation: POST /cart/checkout
krca_coverage_duration_seconds: 900
krca_coverage_requests_per_second: 6
krca_coverage_settle_seconds: 45

stategraph_namespace: graph-rca
stategraph_statefulset_name: neo4j
stategraph_service_name: neo4j
stategraph_auth_secret_name: neo4j-auth
stategraph_remote_directory: /etc/agent-rca/stategraph
stategraph_remote_manifest: /etc/agent-rca/stategraph/stategraph.yaml
stategraph_wait_timeout: 15m
stategraph_smoke_remote_directory: /opt/agent-rca/stategraph-smoke
stategraph_smoke_seed_service: checkoutservice
incident_platform_namespace: incident-platform
incident_platform_readonly_manifest: /etc/agent-rca/stategraph/incident-platform-readonly.yaml
incident_platform_remote_directory: /etc/agent-rca/incident-platform
incident_platform_remote_manifest: /etc/agent-rca/incident-platform/runtime.yaml
incident_platform_postgresql_statefulset: postgresql
incident_platform_postgresql_service: postgresql
incident_platform_postgresql_secret: postgresql-auth
incident_platform_stategraph_secret: stategraph-runtime-auth
incident_platform_reconciler_cronjob: stategraph-reconciler
incident_platform_webhook_deployment: incident-webhook
incident_platform_webhook_service: incident-webhook
incident_platform_webhook_secret: incident-webhook-auth
incident_platform_webhook_node_port: 30080
incident_platform_worker_deployment: incident-worker
incident_platform_viewer_deployment: incident-viewer
incident_platform_viewer_service: incident-viewer
incident_platform_viewer_secret: incident-viewer-auth
incident_platform_viewer_database_role: incident_viewer
incident_platform_viewer_frontend_deployment: incident-viewer-frontend
incident_platform_viewer_frontend_service: incident-viewer-frontend
incident_platform_viewer_frontend_network_policy: incident-viewer-frontend-network
incident_platform_viewer_frontend_remote_directory: /etc/agent-rca/incident-viewer-frontend
incident_platform_viewer_frontend_remote_manifest: /etc/agent-rca/incident-viewer-frontend/runtime.yaml
incident_platform_agent_runtime_enabled: "{{ incident_platform.agent_worker.enabled }}"
incident_platform_agent_worker_deployment: incident-agent-worker
incident_platform_agent_secret: incident-agent-auth
incident_platform_alertmanager_config: agent-rca-incidents
incident_platform_wait_timeout: 10m
incident_platform_domain_mode: local
incident_platform_target_cluster_id: "{{ cluster_name }}"
incident_platform_target_kubernetes_api_server: https://kubernetes.default.svc
incident_platform_remote_kubernetes_secret: remote-target-kubernetes
incident_platform_prometheus_base_url: >-
  http://monitoring-kube-prometheus-prometheus.observability.svc.cluster.local:9090
incident_platform_loki_base_url: >-
  http://loki-gateway.observability.svc.cluster.local
incident_platform_hubble_server: hubble-relay.kube-system.svc.cluster.local:80
incident_platform_webhook_service_type: >-
  {{ 'NodePort' if incident_platform_domain_mode == 'control' else 'ClusterIP' }}
incident_platform_remote_token_mount_path: /var/run/secrets/agent-rca-target/token
incident_platform_remote_ca_mount_path: /var/run/secrets/agent-rca-target/ca.crt
three_domain_target_access_token_secret: incident-platform-reader-token
