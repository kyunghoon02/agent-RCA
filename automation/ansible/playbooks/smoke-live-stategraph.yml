---
- name: Smoke the live Neo4j StateGraph vertical slice
  hosts: control_plane
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
    - "{{ deployment_profile_vars_file | default('../group_vars/default-profile.yml') }}"
    - ../../../platform/versions.yaml

  roles:
    - role: stategraph_verify
    - role: stategraph_smoke
