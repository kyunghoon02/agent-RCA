---
- name: Deploy and verify the Neo4j StateGraph
  hosts: control_plane
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
    - "{{ deployment_profile_vars_file | default('../group_vars/default-profile.yml') }}"
    - ../../../platform/versions.yaml

  roles:
    - role: stategraph_stack
    - role: stategraph_verify
