---
- name: Roll only the collection worker and verify bounded Hubble collection
  hosts: rca_control
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
    - ../../../platform/versions.yaml
  tasks:
    - name: Read the existing collection worker
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get deployment {{ incident_platform_worker_deployment }}
        --namespace {{ incident_platform_namespace }} --output json
      register: collection_worker_before
      changed_when: false

    - name: Require the existing bounded worker and independently pinned image
      ansible.builtin.assert:
        that:
          - incident_platform.worker.image_digest is match('^sha256:[0-9a-f]{64}$')
          - (collection_worker_before.stdout | from_json).spec.replicas == 1
          - (collection_worker_before.stdout | from_json).spec.template.spec.containers | length == 1
          - (collection_worker_before.stdout | from_json).spec.template.spec.containers[0].name == 'worker'
          - (collection_worker_before.stdout | from_json).spec.template.spec.serviceAccountName == 'incident-platform-reader'
        fail_msg: Install the reviewed collection worker before this image-only rollout.

    - name: Read the local VM project identity
      ansible.builtin.uri:
        url: http://metadata.google.internal/computeMetadata/v1/project/project-id
        headers:
          Metadata-Flavor: Google
        return_content: true
      register: collection_worker_project
      no_log: true

    - name: Read a short-lived registry credential from the VM identity
      ansible.builtin.uri:
        url: http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token
        headers:
          Metadata-Flavor: Google
        return_content: true
      register: collection_worker_registry_token
      no_log: true

    - name: Refresh the existing Artifact Registry pull Secret
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, /etc/kubernetes/admin.conf, apply, --filename=-]
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: artifact-registry
            namespace: {{ incident_platform_namespace }}
          type: kubernetes.io/dockerconfigjson
          stringData:
            .dockerconfigjson: >-
              {"auths":{"{{ execution_target.location }}-docker.pkg.dev":{"username":"oauth2accesstoken","password":"{{ (collection_worker_registry_token.content | from_json).access_token }}","auth":"{{ ('oauth2accesstoken:' + (collection_worker_registry_token.content | from_json).access_token) | b64encode }}"}}}
      no_log: true
      changed_when: true

    - name: Resolve the new collection worker image
      ansible.builtin.set_fact:
        collection_worker_image: >-
          {{ execution_target.location }}-docker.pkg.dev/{{ collection_worker_project.content }}/{{ incident_platform.artifact_repository_id }}/agent-rca-runtime@{{ incident_platform.worker.image_digest }}
      no_log: true

    - name: Patch only the collection worker container image
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - set
          - image
          - "deployment/{{ incident_platform_worker_deployment }}"
          - --namespace
          - "{{ incident_platform_namespace }}"
          - "worker={{ collection_worker_image }}"
      register: collection_worker_patch
      changed_when: "'image updated' in collection_worker_patch.stdout"

    - name: Wait for the collection worker rollout
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        rollout status deployment/{{ incident_platform_worker_deployment }}
        --namespace {{ incident_platform_namespace }} --timeout={{ incident_platform_wait_timeout }}
      changed_when: false

    - name: Read the deployed collection Hubble CLI version
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        exec deployment/{{ incident_platform_worker_deployment }}
        --namespace {{ incident_platform_namespace }} -- hubble version
      register: collection_worker_hubble_version
      changed_when: false

    - name: Require the collection CLI version pinned for the Relay
      ansible.builtin.assert:
        that:
          - collection_worker_hubble_version.stdout.startswith('hubble ' + hubble.worker_cli_version + '@')
        fail_msg: The collection runtime does not contain the expected Hubble CLI binary.

    - name: Verify v2 Hubble collection and projection without creating an Incident
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - exec
          - "deployment/{{ incident_platform_worker_deployment }}"
          - --namespace
          - "{{ incident_platform_namespace }}"
          - --
          - python
          - -c
          - |
            import json, os
            from datetime import datetime, timedelta, timezone
            from incident_platform.evidence import CollectionRequest, EvidenceBuilder, EvidenceWindow, ResourceScope
            from incident_platform.hubble_contract import FEATURE_SET
            from incident_platform.providers.hubble import HubbleCLIClient, HubbleNetworkFlowProvider
            from incident_platform.projectors.hubble import HubbleNetworkFlowEvidenceProjector
            now = datetime.now(timezone.utc)
            fmt = lambda value: value.isoformat().replace('+00:00', 'Z')
            request = CollectionRequest(
                request_id='req-live-hubble-readonly', incident_id='inc-live-hubble-readonly',
                window=EvidenceWindow(start=fmt(now-timedelta(seconds=60)), end=fmt(now)),
                scope=ResourceScope(namespace=os.environ['INCIDENT_WORKER_TARGET_NAMESPACE'],
                    resource_names=('frontend',), max_items=1), timeout_seconds=15,
            )
            provider = HubbleNetworkFlowProvider(HubbleCLIClient(os.environ['HUBBLE_SERVER']),
                cluster_id=os.environ['INCIDENT_WORKER_CLUSTER_ID'], max_raw_flows=500)
            batch = provider.collect(request)
            assert FEATURE_SET == 'hubble-network-flow-summary-v2'
            assert len(batch.items) == 1
            draft = batch.items[0]
            evidence = EvidenceBuilder().build(draft, request, collected_at=datetime.now(timezone.utc))
            projection = HubbleNetworkFlowEvidenceProjector().project(evidence)
            assert draft.facts['flow_count'] > 0, 'No flow observed in the current probe window'
            assert len(projection.records) == 2
            print(json.dumps({'feature_set': FEATURE_SET, 'status': batch.status,
                'flow_count': draft.facts['flow_count'], 'flow_signal': draft.facts['flow_signal'],
                'observation_gaps': draft.facts['observation_gaps'],
                'truncated': draft.facts['truncated'],
                'retention_status': draft.facts['retention_status'],
                'projected_records': len(projection.records), 'incident_persisted': False}))
            assert batch.status == 'SUCCEEDED', 'Hubble probe has incomplete collection'
            assert not draft.facts['observation_gaps'], 'Hubble observation gaps remain'
            assert not draft.facts['truncated'], 'Hubble probe reached its flow budget'
      register: collection_worker_hubble_probe
      changed_when: false

    - name: Show the redacted Hubble runtime proof
      ansible.builtin.debug:
        msg: "{{ collection_worker_hubble_probe.stdout | from_json }}"
