---
- name: Evaluate the controlled paymentservice image pull scenario
  hosts: fault_target
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
    - "{{ deployment_profile_vars_file | default('../group_vars/default-profile.yml') }}"
    - ../../../platform/versions.yaml
  vars:
    payment_image_pull_scenario: >-
      {{ lookup(
        'file',
        playbook_dir + '/../../../evaluation/scenarios/paymentservice-image-pull.yaml'
      ) | from_yaml }}

  roles:
    - role: payment_image_pull_fault_harness
