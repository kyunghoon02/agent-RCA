---
- name: Deploy and verify the bounded Chaos Mesh evaluation runtime
  hosts: control_plane
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
    - "{{ deployment_profile_vars_file | default('../group_vars/default-profile.yml') }}"

  roles:
    - role: cluster_verify
    - role: chaos_mesh_stack
    - role: chaos_mesh_verify
