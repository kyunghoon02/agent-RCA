---
- name: Evaluate the controlled checkoutservice OOM scenario
  hosts: fault_target
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
    - "{{ deployment_profile_vars_file | default('../group_vars/default-profile.yml') }}"
    - ../../../platform/versions.yaml
  vars:
    checkout_oom_scenario_path: evaluation/scenarios/checkoutservice-oom.yaml
    checkout_oom_scenario: >-
      {{ lookup(
        'file',
        playbook_dir + '/../../../' + checkout_oom_scenario_path
      ) | from_yaml }}

  roles:
    - role: checkout_oom_fault_harness
