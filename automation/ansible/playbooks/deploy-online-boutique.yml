---
- name: Deploy and verify the Online Boutique target workload
  hosts: control_plane
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
    - "{{ deployment_profile_vars_file | default('../group_vars/default-profile.yml') }}"
    - ../../../platform/versions.yaml

  roles:
    - role: online_boutique
    - role: cluster_verify
    - role: online_boutique_verify
