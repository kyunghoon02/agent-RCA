schema_version: "1.0.0"
scenario_id: scenario-holdout-v1-checkout-missing-configmap-a

environment:
  class: development
  single_node_allowed: true

target:
  namespace: online-boutique
  kind: Deployment
  name: checkoutservice
  container: server

baseline:
  ready_replicas: 1
  fresh_pod_restart_count: 0
  fault_volume_absent: true
  fault_volume_mount_absent: true
  configmap_absent: true

fault:
  type: required-configmap-reference
  configmap_name: checkoutservice-holdout-v1-missing-a
  volume_name: holdout-v1-required-a
  mount_path: /var/run/agent-rca-holdout-v1/a
  observation_seconds: 15
  maximum_active_seconds: 180

workload:
  runner: none
  profile: normal
  seed: 144
  synthetic_marker: agent-rca-holdout-v1-case-03

alert:
  name: AgentRCAHoldoutV1Case03
  service: checkoutservice
  severity: critical
  summary: Synthetic service health evaluation
  generator_url: https://prometheus.invalid/holdout-v1
  verification_prefix: holdout-v1-case-03
  rca_enabled: "true"
  agent_rca_enabled: "true"

expected:
  outcome: ROOT_CAUSE
  root_cause_ids:
    - kubernetes.missing-configmap
  evidence_predicates:
    configmap_name: checkoutservice-holdout-v1-missing-a
    required: true
    event_reasons:
      - CreateContainerConfigError
      - FailedMount
    missing_kind: ConfigMap

restoration:
  remove_exact_volume: true
  remove_exact_volume_mount: true
  restore_exact_pod_template: true
  ready_replicas: 1
  fresh_pod_restart_count: 0
  configmap_absent: true
