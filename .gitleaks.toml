title = "Agent RCA Gitleaks configuration"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Go module checksums embedded in the reviewed shippingservice patch"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^platform/online-boutique/source-patches/shippingservice-otel\.patch$''']
regexTarget = "match"
regexes = ['''^(?:auth|oauth2adapt|oauth2|api)\s+v\S+\s+h1:[A-Za-z0-9+/=]+$''']
