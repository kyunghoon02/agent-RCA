global:
  podSecurityContext:
    supplementalGroups:
      - 999

alloy:
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          target_label = "cluster_id"
          replacement  = "[[ cluster_name | default('agent-rca-dev') ]]"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.local.receiver]
      }

      loki.source.journal "kernel" {
        path       = "/var/log/journal"
        max_age    = "2h"
        matches    = "_TRANSPORT=kernel"
        labels     = {
          cluster_id = "[[ cluster_name | default('agent-rca-dev') ]]",
          job        = "kernel-journal",
        }
        forward_to = [loki.process.kernel_oom.receiver]
      }

      loki.process "kernel_oom" {
        stage.regex {
          expression = "oom-kill:constraint=CONSTRAINT_MEMCG.*oom_memcg=/[^, ]*-pod(?P<pod_uid>[0-9a-f_]{36})\\.slice"
        }

        stage.labels {
          values = {
            pod_uid = "",
          }
        }

        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "[[ observability_loki_write_url | default('http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push') ]]"
        }
      }
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  mounts:
    extra:
      - name: host-journal
        mountPath: /var/log/journal
        readOnly: true

controller:
  type: daemonset
  volumes:
    extra:
      - name: host-journal
        hostPath:
          path: /var/log/journal
          type: Directory

rbac:
  create: true
  rules:
    - apiGroups:
        - ""
      resources:
        - namespaces
        - pods
        - pods/log
      verbs:
        - get
        - list
        - watch
  # Alloy 1.11.1 appends clusterRules directly after rules and renders an empty
  # value as invalid YAML. This duplicate subset grants no permission beyond
  # the pod read access above while keeping the chart output valid.
  clusterRules:
    - apiGroups:
        - ""
      resources:
        - pods
      verbs:
        - get

service:
  enabled: true
  type: ClusterIP

serviceMonitor:
  enabled: true
  additionalLabels:
    release: monitoring
