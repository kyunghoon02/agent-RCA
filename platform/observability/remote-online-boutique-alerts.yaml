apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: remote-online-boutique-agent-rca
  namespace: online-boutique
  labels:
    release: monitoring
    app.kubernetes.io/part-of: agent-rca
spec:
  groups:
    - name: remote-online-boutique-agent-rca
      interval: 15s
      rules:
        - alert: OnlineBoutiqueHomeHighFailureRate
          expr: |
            (
              max by (cluster_id, namespace, service_name) (
                agent_rca_api_failure_rate{
                  cluster_id="FAULT_TARGET_CLUSTER_ID",
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="GET /"
                }
              ) > 0.05
            )
            and on (cluster_id, namespace, service_name)
            (
              sum by (cluster_id, namespace, service_name) (
                agent_rca_api_request_rate{
                  cluster_id="FAULT_TARGET_CLUSTER_ID",
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="GET /"
                }
              ) > 0.1
            )
          for: 2m
          labels:
            namespace: online-boutique
            service: frontend
            severity: critical
            rca_enabled: "true"
            agent_rca_enabled: "true"
            krca_profile: browse-home
          annotations:
            summary: Online Boutique home route failure rate is above 5 percent
            description: The remote home route has sustained failures with active traffic.
        - alert: OnlineBoutiqueProductDetailHighFailureRate
          expr: |
            (
              max by (cluster_id, namespace, service_name) (
                agent_rca_api_failure_rate{
                  cluster_id="FAULT_TARGET_CLUSTER_ID",
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="GET /product/{id}"
                }
              ) > 0.05
            )
            and on (cluster_id, namespace, service_name)
            (
              sum by (cluster_id, namespace, service_name) (
                agent_rca_api_request_rate{
                  cluster_id="FAULT_TARGET_CLUSTER_ID",
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="GET /product/{id}"
                }
              ) > 0.1
            )
          for: 2m
          labels:
            namespace: online-boutique
            service: frontend
            severity: critical
            rca_enabled: "true"
            agent_rca_enabled: "true"
            krca_profile: product-detail
          annotations:
            summary: Online Boutique product route failure rate is above 5 percent
            description: The remote product detail route has sustained failures with active traffic.
        - alert: OnlineBoutiqueCartReadHighFailureRate
          expr: |
            (
              max by (cluster_id, namespace, service_name) (
                agent_rca_api_failure_rate{
                  cluster_id="FAULT_TARGET_CLUSTER_ID",
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="GET /cart"
                }
              ) > 0.05
            )
            and on (cluster_id, namespace, service_name)
            (
              sum by (cluster_id, namespace, service_name) (
                agent_rca_api_request_rate{
                  cluster_id="FAULT_TARGET_CLUSTER_ID",
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="GET /cart"
                }
              ) > 0.1
            )
          for: 2m
          labels:
            namespace: online-boutique
            service: frontend
            severity: critical
            rca_enabled: "true"
            agent_rca_enabled: "true"
            krca_profile: cart-read
          annotations:
            summary: Online Boutique cart read failure rate is above 5 percent
            description: The remote cart read route has sustained failures with active traffic.
        - alert: OnlineBoutiqueCartAddHighFailureRate
          expr: |
            (
              max by (cluster_id, namespace, service_name) (
                agent_rca_api_failure_rate{
                  cluster_id="FAULT_TARGET_CLUSTER_ID",
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="POST /cart"
                }
              ) > 0.05
            )
            and on (cluster_id, namespace, service_name)
            (
              sum by (cluster_id, namespace, service_name) (
                agent_rca_api_request_rate{
                  cluster_id="FAULT_TARGET_CLUSTER_ID",
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="POST /cart"
                }
              ) > 0.1
            )
          for: 2m
          labels:
            namespace: online-boutique
            service: frontend
            severity: critical
            rca_enabled: "true"
            agent_rca_enabled: "true"
            krca_profile: cart-add
          annotations:
            summary: Online Boutique cart add failure rate is above 5 percent
            description: The remote cart add route has sustained failures with active traffic.
        - alert: OnlineBoutiqueCartEmptyHighFailureRate
          expr: |
            (
              max by (cluster_id, namespace, service_name) (
                agent_rca_api_failure_rate{
                  cluster_id="FAULT_TARGET_CLUSTER_ID",
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="POST /cart/empty"
                }
              ) > 0.05
            )
            and on (cluster_id, namespace, service_name)
            (
              sum by (cluster_id, namespace, service_name) (
                agent_rca_api_request_rate{
                  cluster_id="FAULT_TARGET_CLUSTER_ID",
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="POST /cart/empty"
                }
              ) > 0.1
            )
          for: 2m
          labels:
            namespace: online-boutique
            service: frontend
            severity: critical
            rca_enabled: "true"
            agent_rca_enabled: "true"
            krca_profile: cart-empty
          annotations:
            summary: Online Boutique cart empty failure rate is above 5 percent
            description: The remote cart empty route has sustained failures with active traffic.
        - alert: OnlineBoutiqueCheckoutHighFailureRate
          expr: |
            (
              max by (cluster_id, namespace, service_name) (
                agent_rca_api_failure_rate{
                  cluster_id="FAULT_TARGET_CLUSTER_ID",
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="POST /cart/checkout"
                }
              ) > 0.05
            )
            and on (cluster_id, namespace, service_name)
            (
              sum by (cluster_id, namespace, service_name) (
                agent_rca_api_request_rate{
                  cluster_id="FAULT_TARGET_CLUSTER_ID",
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="POST /cart/checkout"
                }
              ) > 0.1
            )
          for: 2m
          labels:
            namespace: online-boutique
            service: frontend
            severity: critical
            rca_enabled: "true"
            agent_rca_enabled: "true"
            krca_profile: checkout-full
          annotations:
            summary: Online Boutique checkout failure rate is above 5 percent
            description: The remote checkout route has sustained failures with active traffic.
