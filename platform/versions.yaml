    image_digest: sha256:74f17740679e5a88250cd8a1f8d5b9e33a26f7a062dac501a9f4406af13054db
    service_type: ClusterIP
    port: 3100
  webhook:
    server: gunicorn
    server_version: 26.0.0
    max_body_bytes: 1048576
    max_alerts_per_request: 100
    alert_matcher: rca_enabled=true
  worker:
    poll_interval_seconds: 2
    lease_seconds: 120
    max_attempts: 3
    provider_timeout_seconds: 20
    max_evidence_items: 32
    localization_max_candidates: 10
    localization_max_entities: 40
    localization_max_depth: 4
  agent_worker:
    enabled: true
    model: gpt-5.6-luna
    poll_interval_seconds: 2
    lease_seconds: 180
    max_attempts: 3
    eligibility_label: agent_rca_enabled
    activated_at: "2026-08-27T06:30:00Z"
    min_claim_interval_seconds: 60
    circuit_failure_threshold: 3
    circuit_cooldown_seconds: 300
    metrics_port: 9090
    max_turns: 6
    max_llm_calls: 6
    max_tool_calls: 12
    max_evidence_candidates: 8
    max_output_tokens: 2000
    max_wall_time_ms: 60000

