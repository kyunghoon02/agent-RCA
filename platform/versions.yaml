schema_version: "1.0.0"

terraform:
  cli_minimum: "1.14.0"
  provider: hashicorp/google
  provider_version: "7.45.0"

execution_target:
  cloud: gcp
  location: asia-northeast3

host:
  distribution: ubuntu
  release: "24.04"
  architecture: amd64

ansible:
  core_version: "2.20.7"

containerd:
  package_version: "2.2.1-0ubuntu1~24.04.3"

kubernetes_release:
  minor: "v1.36"
  version: "v1.36.4"
  deb_version: "1.36.4-1.1"

chaos_evaluation:
  kubernetes_release:
    minor: "v1.35"
    version: "v1.35.8"
    deb_version: "1.35.8-1.1"
  chaos_mesh:
    namespace: chaos-mesh
    target_namespace: online-boutique
    chart_ref: chaos-mesh/chaos-mesh
    chart_repository: https://charts.chaos-mesh.org
    chart_version: "2.8.4"
    cluster_scoped: false
    container_runtime: containerd
    runtime_socket: /run/containerd/containerd.sock

kubernetes:
  service: self-managed
  distribution: upstream
  bootstrap_tool: kubeadm
  cluster_availability: single-node-dev
  container_runtime: containerd
  dataplane: cilium
  network_observability: hubble
  cloud_identity: dedicated-vm-service-account

helm:
  minimum_version: "3.13.0"
  version: "v3.21.4"

cilium:
  chart_version: "1.20.1"
  cli_version: "v0.19.7"

hubble:
  cli_version: "v1.19.4"

observability:
  namespace: observability
  local_path_provisioner:
    chart_ref: oci://ghcr.io/rancher/local-path-provisioner/charts/local-path-provisioner
