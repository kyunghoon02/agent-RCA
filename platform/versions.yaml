schema_version: "1.0.0"

terraform:
  cli_minimum: "1.14.0"
  provider: hashicorp/google
  provider_version: "7.45.0"

execution_target:
  cloud: gcp
  location: asia-northeast3

host:
  distribution: ubuntu
  release: "24.04"
  architecture: amd64

ansible:
  core_version: "2.20.7"

containerd:
  package_version: "2.2.1-0ubuntu1~24.04.3"

kubernetes_release:
  minor: "v1.36"
  version: "v1.36.4"
  deb_version: "1.36.4-1.1"

kubernetes:
  service: self-managed
  distribution: upstream
  bootstrap_tool: kubeadm
  cluster_availability: single-node-dev
  container_runtime: containerd
  dataplane: cilium
  network_observability: hubble
  cloud_identity: dedicated-vm-service-account

helm:
  minimum_version: "3.13.0"
  version: "v3.21.4"

cilium:
  chart_version: "1.20.1"
  cli_version: "v0.19.7"

hubble:
  cli_version: "v1.19.3"

observability:
  namespace: observability
  local_path_provisioner:
    chart_ref: oci://ghcr.io/rancher/local-path-provisioner/charts/local-path-provisioner
    chart_version: "0.0.36"
    chart_digest: sha256:ae31255346657674a47b99619a16fa12bf38e1e6ef51e2df12b0825fdb1fa80c
    storage_class: agent-rca-local
    reclaim_policy: Retain
  kube_prometheus_stack:
    chart_ref: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    chart_version: "88.5.3"
    retention: 7d
    retention_size: 12GiB
  loki:
    chart_ref: oci://ghcr.io/grafana-community/helm-charts/loki
    chart_version: "18.11.0"
    deployment_mode: Monolithic
    retention: 72h
  alloy:
    chart_ref: grafana/alloy
    chart_repository: https://grafana.github.io/helm-charts
    chart_version: "1.11.1"
    controller_type: deployment

online_boutique:
  repository: "https://github.com/GoogleCloudPlatform/microservices-demo.git"
  release_tag: "v0.10.6"
  commit_sha: "5b3a712ab85ccb8f6f7cd5b720d36ba9a8d041eb"
  image_tag: "v0.10.6"
  remote_kustomize_base: "https://github.com/GoogleCloudPlatform/microservices-demo//kustomize?ref=5b3a712ab85ccb8f6f7cd5b720d36ba9a8d041eb"
