    image_digest: sha256:65a5789759435f1ef696f1953258b9bbdb18eb571d5ce711ff812d2e128288a4
    deployment_mode: monolithic
    retention: 72h
    storage: 5Gi
  alloy:
    chart_ref: grafana/alloy
    chart_repository: https://grafana.github.io/helm-charts
    chart_version: "1.11.1"
    controller_type: daemonset

stategraph:
  namespace: graph-rca
  neo4j:
    edition: community
    version: 5.26.29
    image_digest: sha256:89d577f2e49606de76441eca8cf7a0fe88e594cbaac4d2a3d86c6e59676e2b1e
    database: neo4j
    storage: 5Gi

incident_platform:
  namespace: incident-platform
  artifact_repository_id: agent-rca-dev-workloads
  postgresql:
    version: 17.6
    image_digest: sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    database: agent_rca
    storage: 5Gi
  reconciler:
    schedule: "*/5 * * * *"
    concurrency_policy: Forbid
    image_tag: runtime-b77fc0cffae9
    image_digest: sha256:4f14ed8a9d0613352d8b98fbbf79388a180e91d78c7bfa39eb87d134a4daefe9
  viewer_frontend:
    node_version: 22.17.1
