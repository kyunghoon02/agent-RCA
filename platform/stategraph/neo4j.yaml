apiVersion: v1
kind: ServiceAccount
metadata:
  name: neo4j
  namespace: graph-rca
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: agent-rca
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j-headless
  namespace: graph-rca
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: agent-rca
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: graph-rca
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: agent-rca
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: graph-rca
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: agent-rca
spec:
  replicas: 1
  serviceName: neo4j-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neo4j
        app.kubernetes.io/part-of: agent-rca
    spec:
      serviceAccountName: neo4j
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: neo4j
          image: docker.io/library/neo4j:5.26.29-community@sha256:89d577f2e49606de76441eca8cf7a0fe88e594cbaac4d2a3d86c6e59676e2b1e
          imagePullPolicy: IfNotPresent
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: auth
            - name: NEO4J_server_default__listen__address
              value: 0.0.0.0
            - name: NEO4J_server_http_enabled
              value: "false"
            - name: NEO4J_server_https_enabled
              value: "false"
            - name: NEO4J_server_memory_heap_initial__size
              value: 256m
            - name: NEO4J_server_memory_heap_max__size
              value: 512m
            - name: NEO4J_server_memory_pagecache_size
              value: 256m
          ports:
            - name: bolt
              containerPort: 7687
          startupProbe:
            tcpSocket:
              port: bolt
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: bolt
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: neo4j
          app.kubernetes.io/part-of: agent-rca
      spec:
        storageClassName: agent-rca-local
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
