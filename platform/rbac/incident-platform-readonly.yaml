apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-platform-reader
  namespace: incident-platform
  labels:
    app.kubernetes.io/part-of: incident-platform
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-platform-target-reader
  namespace: online-boutique
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - persistentvolumeclaims
      - pods
      - resourcequotas
      - services
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources:
      - deployments
      - replicasets
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources:
      - endpointslices
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources:
      - jobs
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-platform-target-reader
  namespace: online-boutique
subjects:
  - kind: ServiceAccount
    name: incident-platform-reader
    namespace: incident-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-platform-target-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: incident-platform-cluster-reader
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - persistentvolumes
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: incident-platform-cluster-reader
subjects:
  - kind: ServiceAccount
    name: incident-platform-reader
    namespace: incident-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: incident-platform-cluster-reader
