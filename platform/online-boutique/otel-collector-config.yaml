extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  resource:
    attributes:
      - key: agent_rca.cluster_id
        value: agent-rca-dev
        action: upsert
      - key: deployment.environment.name
        value: dev
        action: upsert
  transform/frontend_routes:
    error_mode: ignore
    trace_statements:
      - >-
        set(span.name, "GET /") where
        resource.attributes["service.name"] == "frontend" and
        span.name == "GET" and span.attributes["url.path"] == "/"
      - >-
        set(span.name, "GET /product/{id}") where
        resource.attributes["service.name"] == "frontend" and
        span.name == "GET" and
        IsMatch(span.attributes["url.path"], "^/product/[^/]+$")
      - >-
        set(span.name, "GET /cart") where
        resource.attributes["service.name"] == "frontend" and
        span.name == "GET" and span.attributes["url.path"] == "/cart"
      - >-
        set(span.name, "POST /cart") where
        resource.attributes["service.name"] == "frontend" and
        span.name == "POST" and span.attributes["url.path"] == "/cart"
      - >-
        set(span.name, "POST /cart/empty") where
        resource.attributes["service.name"] == "frontend" and
        span.name == "POST" and span.attributes["url.path"] == "/cart/empty"
      - >-
        set(span.name, "POST /cart/checkout") where
        resource.attributes["service.name"] == "frontend" and
        span.name == "POST" and span.attributes["url.path"] == "/cart/checkout"
  filter/krca_health:
    error_mode: ignore
    trace_conditions:
      - >-
        resource.attributes["service.name"] == "frontend" and
        span.attributes["url.path"] == "/_healthz"
  batch:
    timeout: 5s
    send_batch_size: 512

connectors:
  span_metrics:
    namespace: agent_rca
    histogram:
      unit: ms
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
    dimensions:
      - name: rpc.system
      - name: rpc.service
      - name: rpc.method
    exemplars:
      enabled: true
      max_per_data_point: 5
    aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
    aggregation_cardinality_limit: 5000
    metrics_flush_interval: 15s
    metrics_expiration: 5m
    series_expiration: 5m
    resource_metrics_key_attributes:
      - service.name
      - telemetry.sdk.language
      - telemetry.sdk.name
  service_graph:
    latency_histogram_buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
    store:
      ttl: 5s
      max_items: 10000
    virtual_node_peer_attributes:
      - peer.service
      - server.address
      - net.peer.name
    virtual_node_extra_label: true
    metrics_flush_interval: 15s

exporters:
  otlp/tempo:
    endpoint: tempo.observability.svc.cluster.local:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    metric_expiration: 5m
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform/frontend_routes, batch]
      exporters: [otlp/tempo]
    traces/derived:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resource
        - transform/frontend_routes
        - filter/krca_health
        - batch
      exporters: [span_metrics, service_graph]
    metrics/derived:
      receivers: [span_metrics, service_graph]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
