apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
spec:
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      imagePullSecrets:
        - name: artifact-registry
      containers:
        - name: server
          env:
            - name: COLLECTOR_SERVICE_ADDR
              value: opentelemetrycollector:4317
            - name: ENABLE_TRACING
              value: "1"
            - name: OTEL_SERVICE_NAME
              value: adservice
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetrycollector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_TRACES_SAMPLER
              value: always_on
