apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - name: COLLECTOR_SERVICE_ADDR
              value: opentelemetrycollector:4317
            - name: OTEL_SERVICE_NAME
              value: emailservice
            - name: ENABLE_TRACING
              value: "1"
