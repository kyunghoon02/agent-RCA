apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
spec:
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      imagePullSecrets:
        - name: artifact-registry
      containers:
        - name: server
          env:
            - name: COLLECTOR_SERVICE_ADDR
              value: opentelemetrycollector:4317
            - name: ENABLE_TRACING
              value: "1"
            - name: OTEL_SERVICE_NAME
              value: shippingservice
