apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: online-boutique-otel-rca
  labels:
    release: monitoring
spec:
  groups:
    - name: online-boutique-otel-rca
      interval: 15s
      rules:
        - record: agent_rca_api_request_rate
          expr: |
            sum by (namespace, service_name, span_name) (
              rate(agent_rca_calls_total{
                namespace="online-boutique",
                span_kind="SPAN_KIND_SERVER"
              }[2m])
            )
        - record: agent_rca_api_failure_rate
          expr: |
            (
              sum by (namespace, service_name, span_name) (
                rate(agent_rca_calls_total{
                  namespace="online-boutique",
                  span_kind="SPAN_KIND_SERVER",
                  status_code="STATUS_CODE_ERROR"
                }[2m])
              )
              or on (namespace, service_name, span_name)
              (
                0 * sum by (namespace, service_name, span_name) (
                  rate(agent_rca_calls_total{
                    namespace="online-boutique",
                    span_kind="SPAN_KIND_SERVER"
                  }[2m])
                )
              )
            )
            /
            clamp_min(
              sum by (namespace, service_name, span_name) (
                rate(agent_rca_calls_total{
                  namespace="online-boutique",
                  span_kind="SPAN_KIND_SERVER"
                }[2m])
              ),
              0.000000001
            )
        - record: agent_rca_api_latency_p95_milliseconds
          expr: |
            (
              histogram_quantile(
                0.95,
                sum by (le, namespace, service_name, span_name) (
                  rate(agent_rca_duration_milliseconds_bucket{
                    namespace="online-boutique",
                    span_kind="SPAN_KIND_SERVER"
                  }[2m])
                )
              )
              and on (namespace, service_name, span_name)
              (agent_rca_api_request_rate > 0)
            )
        - record: agent_rca_api_latency_baseline_p95_milliseconds
          expr: |
            (
              histogram_quantile(
                0.95,
                sum by (le, namespace, service_name, span_name) (
                  rate(agent_rca_duration_milliseconds_bucket{
                    namespace="online-boutique",
                    span_kind="SPAN_KIND_SERVER"
                  }[15m])
                )
              )
              and on (namespace, service_name, span_name)
              (
                sum by (namespace, service_name, span_name) (
                  rate(agent_rca_calls_total{
                    namespace="online-boutique",
                    span_kind="SPAN_KIND_SERVER"
                  }[15m])
                ) > 0
              )
            )
        - record: agent_rca_pod_memory_working_set_ratio
          expr: |
            max by (namespace, pod) (
              max by (namespace, pod, container) (
                container_memory_working_set_bytes{
                  namespace="online-boutique",
                  container!="",
                  container!="POD",
                  image!=""
                }
              )
              /
              (
                max by (namespace, pod, container) (
                  kube_pod_container_resource_limits{
                    namespace="online-boutique",
                    resource="memory",
                    unit="byte"
                  }
                ) > 0
              )
            )
            * on (namespace, pod) group_left(uid)
            max by (namespace, pod, uid) (
              kube_pod_info{namespace="online-boutique"}
            )
        - record: agent_rca_pod_restart_count_delta
          expr: |
            round(
              sum by (namespace, pod) (
                increase(
                  kube_pod_container_status_restarts_total{
                    namespace="online-boutique"
                  }[30m]
                )
              )
            )
            * on (namespace, pod) group_left(uid)
            max by (namespace, pod, uid) (
              kube_pod_info{namespace="online-boutique"}
            )
        - alert: OnlineBoutiqueHomeHighFailureRate
          expr: |
            (
              max by (namespace, service_name) (
                agent_rca_api_failure_rate{
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="GET /"
                }
              ) > 0.05
            )
            and on (namespace, service_name)
            (
              sum by (namespace, service_name) (
                agent_rca_api_request_rate{
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="GET /"
                }
              ) > 0.1
            )
          for: 2m
          labels:
            namespace: online-boutique
            service: frontend
            severity: critical
            rca_enabled: "true"
            agent_rca_enabled: "true"
            krca_profile: browse-home
          annotations:
            summary: Online Boutique home route failure rate is above 5 percent
            description: The home route has sustained elevated server-side failures with active traffic.
        - alert: OnlineBoutiqueProductDetailHighFailureRate
          expr: |
            (
              max by (namespace, service_name) (
                agent_rca_api_failure_rate{
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="GET /product/{id}"
                }
              ) > 0.05
            )
            and on (namespace, service_name)
            (
              sum by (namespace, service_name) (
                agent_rca_api_request_rate{
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="GET /product/{id}"
                }
              ) > 0.1
            )
          for: 2m
          labels:
            namespace: online-boutique
            service: frontend
            severity: critical
            rca_enabled: "true"
            agent_rca_enabled: "true"
            krca_profile: product-detail
          annotations:
            summary: Online Boutique product route failure rate is above 5 percent
            description: The product detail route has sustained elevated server-side failures with active traffic.
        - alert: OnlineBoutiqueCartReadHighFailureRate
          expr: |
            (
              max by (namespace, service_name) (
                agent_rca_api_failure_rate{
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="GET /cart"
                }
              ) > 0.05
            )
            and on (namespace, service_name)
            (
              sum by (namespace, service_name) (
                agent_rca_api_request_rate{
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="GET /cart"
                }
              ) > 0.1
            )
          for: 2m
          labels:
            namespace: online-boutique
            service: frontend
            severity: critical
            rca_enabled: "true"
            agent_rca_enabled: "true"
            krca_profile: cart-read
          annotations:
            summary: Online Boutique cart read failure rate is above 5 percent
            description: The cart read route has sustained elevated server-side failures with active traffic.
        - alert: OnlineBoutiqueCartAddHighFailureRate
          expr: |
            (
              max by (namespace, service_name) (
                agent_rca_api_failure_rate{
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="POST /cart"
                }
              ) > 0.05
            )
            and on (namespace, service_name)
            (
              sum by (namespace, service_name) (
                agent_rca_api_request_rate{
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="POST /cart"
                }
              ) > 0.1
            )
          for: 2m
          labels:
            namespace: online-boutique
            service: frontend
            severity: critical
            rca_enabled: "true"
            agent_rca_enabled: "true"
            krca_profile: cart-add
          annotations:
            summary: Online Boutique cart add failure rate is above 5 percent
            description: The cart add route has sustained elevated server-side failures with active traffic.
        - alert: OnlineBoutiqueCartEmptyHighFailureRate
          expr: |
            (
              max by (namespace, service_name) (
                agent_rca_api_failure_rate{
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="POST /cart/empty"
                }
              ) > 0.05
            )
            and on (namespace, service_name)
            (
              sum by (namespace, service_name) (
                agent_rca_api_request_rate{
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="POST /cart/empty"
                }
              ) > 0.1
            )
          for: 2m
          labels:
            namespace: online-boutique
            service: frontend
            severity: critical
            rca_enabled: "true"
            agent_rca_enabled: "true"
            krca_profile: cart-empty
          annotations:
            summary: Online Boutique cart empty failure rate is above 5 percent
            description: The cart empty route has sustained elevated server-side failures with active traffic.
        - alert: OnlineBoutiqueCheckoutHighFailureRate
          expr: |
            (
              max by (namespace, service_name) (
                agent_rca_api_failure_rate{
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="POST /cart/checkout"
                }
              ) > 0.05
            )
            and on (namespace, service_name)
            (
              sum by (namespace, service_name) (
                agent_rca_api_request_rate{
                  namespace="online-boutique",
                  service_name="frontend",
                  span_name="POST /cart/checkout"
                }
              ) > 0.1
            )
          for: 2m
          labels:
            namespace: online-boutique
            service: frontend
            severity: critical
            rca_enabled: "true"
            agent_rca_enabled: "true"
            krca_profile: checkout-full
          annotations:
            summary: Online Boutique checkout failure rate is above 5 percent
            description: The checkout route has sustained elevated server-side failures with active traffic.
