clusterScoped: false
timezone: UTC
enableProfiling: false

customLabels:
  agent-rca.dev/purpose: controlled-fault-evaluation

controllerManager:
  replicaCount: 1
  allowHostNetworkTesting: false
  enableFilterNamespace: false
  targetNamespace: online-boutique
  enabledControllers:
    # Chaos Mesh 2.8.4 builds each fault reconciler through the common
    # "<kind>-records" pipeline. Keep every common pipeline enabled because
    # upstream Bootstrap returns at the first disabled pair; the namespace and
    # RBAC boundary below still limits all reconciliation to online-boutique.
    - awschaos-records
    - azurechaos-records
    - dnschaos-records
    - httpchaos-records
    - iochaos-records
    - kernelchaos-records
    - networkchaos-records
    - podchaos-records
    - gcpchaos-records
    - stresschaos-records
    - jvmchaos-records
    - timechaos-records
    - physicalmachinechaos-records
    - blockchaos-records
    - stresschaos-initFinalizers
    - stresschaos-desiredphase
    - stresschaos-condition
    - stresschaos-cleanFinalizers
  enabledWebhooks:
    - stresschaos
  leaderElection:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

chaosDaemon:
  runtime: containerd
  socketPath: /run/containerd/containerd.sock
  hostNetwork: false
  privileged: true
  mtls:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    scrape:
      enabled: true

dashboard:
  create: true
  replicaCount: 1
  securityMode: true
  service:
    type: ClusterIP
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

dnsServer:
  create: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
